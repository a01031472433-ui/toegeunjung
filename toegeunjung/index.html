<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>퇴근중</title>
<meta name="description" content="출근하면 조약돌 돌대리도 출근한다. 직장인 출퇴근 연동 캐릭터 육성 게임.">
<meta name="theme-color" content="#EDF2F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="퇴근중">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}
</style>
<style>
/* Layout: one-column phone app. Cool, quiet sky palette so the grey pebble character reads clearly; blue stays the brand; one typeface; white cards on pale ground. */
:root{
  --bg:#EDF2F8; --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F1F5FA; --ink:#18212F; --muted:#5A6576; --hair:#DCE3ED; --line:#B9C5D6;
  --blue:#3557D8; --blue-dark:#2440AE; --blue-ink:#FFFFFF; --blue-soft:#E2E9FB;
  --yellow:#FFC83D; --gold:#FFC83D; --gold-soft:#FFF3D1; --pink:#F06A97; --coral:#F38B5B; --good:#1E9566; --bad:#DD4A4A;
  --potato:#E3BE84; --potato-dark:#C8975A;
  --wall:#D5E6F6; --wall-2:#C3D9EF; --floor:#9EBEE3; --window:#FFF4CF; --river:#4F7FCF; --skyline:#8FA9CC; --curtain:#F3B6C7; --rug:#F7FAFE;
  --hoodie:#5C8FD8; --hoodie-dark:#3F6FB8; --navy:#26324D; --shirt:#FFFFFF; --tie:#E0485A; --beanie:#E0485A; --beanie-dark:#B8323F;
  --leaf:#2F9561; --pot:#26324D; --machine:#26324D; --poster:#3557D8; --wood:#8A6A4C;
  --hamster:#F2B66E; --hamster-belly:#FFF0D9; --cat:#7D8594; --dog:#D69A62; --dog-dark:#8F5E33;
  --night-bg:#26324D; --night-ink:#EEF2FA; --night-muted:#B6C1D6;
  --font:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --display:var(--font); --body:var(--font); --mono:var(--font);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111723; --paper:#1A2232; --surface:#1A2232; --surface-2:#222C3F; --ink:#ECF1F8; --muted:#A1ACBE; --hair:#2B364B; --line:#3A4760;
  --blue:#6E8EF5; --blue-dark:#4D6CD6; --blue-ink:#0F1524; --blue-soft:#24304D;
  --gold-soft:#3A3120; --good:#45C08A; --bad:#F07575;
  --wall:#283651; --wall-2:#22304A; --floor:#1C2840; --window:#3B4A6E; --river:#2F4F86; --skyline:#41557A; --curtain:#8F5E70; --rug:#2E3B57;
  --navy:#3C4B70; --night-bg:#0B1020;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111723; --paper:#1A2232; --surface:#1A2232; --surface-2:#222C3F; --ink:#ECF1F8; --muted:#A1ACBE; --hair:#2B364B; --line:#3A4760;
  --blue:#6E8EF5; --blue-dark:#4D6CD6; --blue-ink:#0F1524; --blue-soft:#24304D;
  --gold-soft:#3A3120; --good:#45C08A; --bad:#F07575;
  --wall:#283651; --wall-2:#22304A; --floor:#1C2840; --window:#3B4A6E; --river:#2F4F86; --skyline:#41557A; --curtain:#8F5E70; --rug:#2E3B57;
  --navy:#3C4B70; --night-bg:#0B1020;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:anywhere}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.defs{position:absolute;width:0;height:0;overflow:hidden}
.app{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:12px 112px;display:flex;flex-direction:column;gap:16px}
.mono{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:4px}
.brand{display:flex;align-items:center;gap:6px;font-size:32px;line-height:1;letter-spacing:-.5px}
.brand svg{width:40px;height:44px}
.top-r{display:flex;align-items:center;gap:10px}
.coin{display:inline-flex;align-items:center;gap:6px;background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 12px 5px 5px;font-size:16px;box-shadow:0 1px 0 var(--hair)}
.coin i{width:24px;height:24px;border-radius:50%;background:var(--yellow);display:inline-grid;place-items:center;font-style:normal;font-size:12px;color:#18212F}
.clock{font-size:13px;color:var(--muted);text-align:right;line-height:1.3}

.hero{background:var(--paper);border-radius:24px;overflow:hidden}
.scene{position:relative}
.scene svg{display:block;width:100%;height:auto}
.status{position:absolute;left:12px;top:12px;background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:14px;display:flex;align-items:center;gap:7px;box-shadow:0 2px 8px rgba(24,33,47,.08)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--good)}
.dot.done{background:var(--blue)}
.badge{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:14px 18px 18px}
.badge .who{grid-row:span 2;display:flex;flex-direction:column;justify-content:center}
.badge .who b{font-weight:400;font-size:26px;line-height:1.05}
.badge .who span{font-size:12px;letter-spacing:.12em;color:var(--blue);text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.chip{font-size:13px;background:var(--surface-2);border-radius:999px;padding:2px 10px;white-space:nowrap;color:var(--ink)}
.bars{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.bar label{display:flex;justify-content:space-between;font-size:14px}
.bar label b{font-weight:400}
.track{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.fill{height:100%;border-radius:999px;transition:width .5s ease}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-top:4px}
.sec-h h2{font-weight:400;font-size:24px;margin:0;line-height:1.15}
.sec-h small{color:var(--muted);font-size:13.5px}
.steps{display:flex;flex-direction:column;background:var(--paper);border-radius:20px;padding:4px 16px}
.step{display:grid;grid-template-columns:32px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--hair)}
.step:last-child{border-bottom:0}
.num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:var(--surface-2);color:var(--muted)}
.step.done .num{background:var(--blue);color:var(--blue-ink)}
.step.now .num{background:var(--yellow);color:#18212F}
.step-b{min-width:0;display:flex;flex-direction:column;gap:8px}
.step-t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.step-t b{font-weight:400;font-size:19px}
.step-t span{font-size:13.5px;color:var(--muted)}
.btn{border:0;border-radius:14px;padding:12px 16px;font-size:17px;font-weight:400;background:var(--blue);color:var(--blue-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s;box-shadow:0 3px 0 var(--blue-dark)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--blue-dark)}
.btn.ghost{background:var(--surface-2);color:var(--ink);box-shadow:none}
.btn.gold{background:var(--yellow);color:#18212F;box-shadow:0 3px 0 #D9A21C}
.btn.danger{background:var(--bad);color:#fff;box-shadow:none}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.wide{width:100%}
.hint{font-size:13.5px;color:var(--muted)}
.event{background:var(--surface-2);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.event q{font-size:18px;quotes:none;line-height:1.3}
.fx{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.fx span{font-size:13px;padding:1px 9px;border-radius:999px;background:var(--paper)}
.fx .up{color:var(--good)} .fx .down{color:var(--bad)} .fx .c{background:var(--yellow);color:#18212F}
.mission{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;border-radius:14px;background:var(--surface-2);width:100%;text-align:left}
.mission .box{width:24px;height:24px;border-radius:50%;background:var(--paper);display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 2px var(--line)}
.mission.on .box{background:var(--good);box-shadow:none;color:#fff}
.mission .m{flex:1;min-width:0;font-size:16px}
.mission .r{font-size:13.5px;background:var(--gold-soft);padding:0 8px;border-radius:999px}
.mission.on .m{text-decoration:line-through;color:var(--muted)}
.mission[disabled]{cursor:default}
.mission[disabled]:not(.on){opacity:.5}
.clear{background:var(--blue);color:var(--blue-ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.clear h3{margin:0;font-weight:400;font-size:34px;line-height:1}
.clear p{margin:0;font-size:15px}
.clear .btn.ghost{background:var(--paper);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.demo-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--gold-soft);border-radius:14px;padding:8px 12px;font-size:14px}

.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--paper);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:10px;padding:9px 0;font-size:16px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--blue-ink)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--paper);border-radius:18px;padding:10px 10px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.thumb{background:var(--wall);border-radius:12px;aspect-ratio:1/1;max-width:100%;display:grid;place-items:center;overflow:hidden}
.thumb svg{width:88%;height:88%}
.card b{font-weight:400;font-size:17px}
.card .d{font-size:13px;color:var(--muted);min-height:2.6em}
.card .btn{padding:9px 10px;font-size:15px}
.tag{font-size:13px;color:var(--good)}

.panel{background:var(--paper);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.panel>b{font-weight:400;font-size:20px}
.preview{font-size:12px;letter-spacing:.1em;color:var(--blue);text-transform:uppercase}
.districts{display:flex;flex-wrap:wrap;gap:6px}
.districts button{border:0;background:var(--surface-2);border-radius:999px;padding:6px 13px;font-size:15px}
.districts button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.big{font-size:40px;line-height:1.05}
.big small{font-size:15px;color:var(--muted)}
.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{background:var(--surface-2);border-radius:12px;padding:8px 10px}
.mini b{display:block;font-weight:400;font-size:18px}
.mini span{font-size:12.5px;color:var(--muted)}
.night{background:var(--night-bg);color:var(--night-ink);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.night .hint,.night .big small{color:var(--night-muted)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch b{font-weight:400;font-size:18px}
.tog{width:54px;height:30px;border-radius:999px;border:0;background:rgba(255,255,255,.25);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.tog[aria-pressed="true"]{background:var(--yellow)}
.tog[aria-pressed="true"]::after{left:27px}
.tog.light{background:var(--line)}
.tog.light[aria-pressed="true"]{background:var(--blue)}
.roadmap{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--paper);border-radius:12px;padding:4px}
.roadmap div{text-align:center;font-size:13px;padding:6px 2px;border-radius:9px;color:var(--muted)}
.roadmap div.on{background:var(--yellow);color:#18212F}

.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.links a{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);background:var(--surface-2);border-radius:14px;padding:10px 12px}
.links a b{font-weight:400;font-size:17px}
.links a span{font-size:13px;color:var(--muted)}
details{border-top:1px solid var(--hair);padding:11px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-size:17px;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--blue);font-size:22px}
details[open] summary::after{content:"–"}
details ul{margin:8px 0 0;padding-left:18px;font-size:15px;display:flex;flex-direction:column;gap:6px}
details .law{font-size:12.5px;color:var(--blue);margin-top:6px}
.coupon{display:flex;justify-content:space-between;align-items:center;border:2px dashed var(--gold);border-radius:12px;padding:10px 12px;background:var(--gold-soft);font-size:15px}

.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--hair);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tabbar nav{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{border:0;background:transparent;padding:9px 0 11px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--muted)}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--blue)}

.scrim{position:fixed;inset:0;background:rgba(17,23,35,.55);display:grid;place-items:end center;z-index:20;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{width:100%;max-width:428px;background:var(--paper);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto;animation:up .28s ease}
.sheet>*{flex-shrink:0}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.slip{border:1px solid var(--hair);border-radius:14px;overflow:hidden}
.slip-h{display:flex;justify-content:space-between;align-items:flex-end;padding:12px 14px;background:var(--surface-2)}
.slip-h b{font-weight:400;font-size:22px}
.slip-h span{font-size:12.5px;color:var(--muted);text-align:right;line-height:1.35}
.slip table{width:100%;border-collapse:collapse;font-size:15px}
.slip td{padding:7px 14px;border-top:1px solid var(--hair)}
.slip td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.slip tr.sub td{color:var(--muted);font-size:13.5px}
.slip tr.total td{background:var(--gold-soft);font-size:17px}
.slip-wrap{position:relative}
.stamp{position:absolute;right:14px;top:50px;border:3px solid var(--bad);color:var(--bad);font-size:20px;padding:2px 10px;border-radius:8px;transform:rotate(-10deg);animation:stamp .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes stamp{from{transform:rotate(-10deg) scale(2);opacity:0}}
.boxart{display:grid;place-items:center;padding:8px 0;background:var(--wall);border-radius:16px}
.boxart svg{width:150px;height:150px}
.shake{animation:shake .6s ease}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
.prize{display:flex;flex-direction:column;gap:8px}
.prize div{display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.prize b{font-weight:400}
.toasts{position:fixed;left:0;right:0;bottom:calc(78px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:6px;z-index:30;pointer-events:none;padding-inline:16px}
.toast{background:var(--ink);color:var(--bg);padding:10px 15px;border-radius:12px;font-size:15px;max-width:420px;animation:up .25s ease}
.confirm-row{display:flex;gap:10px}
.confirm-row .btn{flex:1}
/* v2: season bar */
.season{grid-column:1/-1;margin-top:12px;background:var(--surface-2);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.season-t{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 8px;font-size:14px}
.season-t b{white-space:nowrap}
.season-t b{font-weight:400;font-size:15px}
.season-t span{color:var(--muted);font-size:13px}
.season .track{height:8px;position:relative;overflow:visible;background:var(--paper)}
.season .fill{background:var(--yellow)}
.season .pin{position:absolute;top:-3px;width:14px;height:14px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 2px var(--line);transform:translateX(-50%)}
.season .pin.got{background:var(--blue);box-shadow:none}
/* v2: onboarding */
.onb{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;display:flex;justify-content:center}
.onb-in{width:100%;max-width:460px;padding:24px 20px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;min-height:100%}
.onb-dots{display:flex;gap:6px;justify-content:center}
.onb-dots i{width:8px;height:8px;border-radius:999px;background:var(--line)}
.onb-dots i.on{width:22px;background:var(--blue)}
.onb-art{background:var(--wall);border-radius:24px;display:grid;place-items:center;padding:16px 0 8px}
.onb-art img{width:62%;height:auto}
.onb h1{font-weight:400;font-size:30px;line-height:1.2;margin:0}
.onb p{margin:0;font-size:16.5px;color:var(--muted)}
.onb .eyebrow{font-size:12.5px;letter-spacing:.12em;color:var(--blue);text-transform:uppercase}
.onb .grow{flex:1}
.rules{display:flex;flex-direction:column;gap:8px;background:var(--paper);border-radius:20px;padding:12px 14px}
.rules div{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;font-size:16px}
.rules div span{color:var(--muted);font-size:13.5px;display:block}
.rules div span.num{display:grid;background:var(--yellow);color:#18212F;font-size:16px}
/* v2: attendance book */
.cal-h{display:flex;align-items:center;justify-content:space-between}
.cal-h b{font-weight:400;font-size:20px}
.cal-nav{border:0;background:var(--surface-2);border-radius:10px;width:36px;height:36px;font-size:18px}
.cal-nav[disabled]{opacity:.35}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:12.5px;color:var(--muted);padding:2px 0}
.cal .wd.sun{color:var(--bad)}
.cal .c{aspect-ratio:1/1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;background:var(--surface-2);color:var(--muted);line-height:1.1;min-width:0}
.cal .c.blank{background:transparent}
.cal .c.work{background:var(--blue);color:var(--blue-ink)}
.cal .c.early{background:var(--blue-soft);color:var(--ink)}
.cal .c.night{background:var(--night-bg);color:var(--night-ink)}
.cal .c.rest{background:var(--gold-soft);color:var(--ink)}
.cal .c.today{box-shadow:inset 0 0 0 2px var(--yellow)}
.cal .c small{font-size:10px;opacity:.85}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ranks{display:flex;flex-direction:column}
.rank{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--hair)}
.rank:first-child{border-top:0}
.rank .d{font-size:13px;color:var(--muted);text-align:center;background:var(--surface-2);border-radius:10px;padding:4px 0}
.rank.got .d{background:var(--blue);color:var(--blue-ink)}
.rank b{font-weight:400;font-size:16.5px;display:block}
.rank span{font-size:13px;color:var(--muted)}
.rank:not(.got) b{color:var(--muted)}
/* v2: promotion order */
.order{border:2px solid var(--ink);border-radius:6px;padding:18px 16px;display:flex;flex-direction:column;gap:10px;text-align:center;background:var(--paper);position:relative}
.order .eyebrow{font-size:12.5px;letter-spacing:.3em;color:var(--muted)}
.order h3{margin:0;font-weight:400;font-size:30px;letter-spacing:.2em}
.order p{margin:0;font-size:16px}
.order .seal{position:absolute;right:14px;bottom:12px;width:58px;height:58px;border-radius:50%;border:3px solid var(--bad);color:var(--bad);display:grid;place-items:center;font-size:13px;line-height:1.1;transform:rotate(-12deg);animation:stamp .35s cubic-bezier(.3,1.6,.5,1)}
.share-prev{border-radius:16px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center}
.share-prev img{width:62%;height:auto;display:block;margin:12px auto;border-radius:12px;box-shadow:0 4px 16px rgba(24,33,47,.15)}
/* v5: 동네 커뮤니티 */
.cm-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.cm-head h2{font-weight:400;font-size:26px;margin:0;line-height:1.2}
.cm-head p{margin:2px 0 6px;color:var(--muted);font-size:15px}
.cm-head .btn{flex:none;padding:10px 16px;font-size:16px}
.online{display:inline-flex;align-items:center;gap:7px;font-size:14px;background:var(--paper);border-radius:999px;padding:4px 12px}
.online b{font-weight:400}
.cm-note{margin:0;font-size:13.5px;color:var(--muted);background:var(--gold-soft);border-radius:12px;padding:8px 12px}
.cm-block{gap:8px}
.cm-h{font-weight:400;font-size:18px}
.plist{display:flex;flex-direction:column}
.prow{border:0;background:transparent;text-align:left;width:100%;padding:10px 2px;border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:2px}
.plist .prow:first-child{border-top:0;padding-top:2px}
.prow.hid{opacity:.6}
.pmeta{font-size:12.5px;color:var(--muted)}
.ptitle{font-weight:400;font-size:16.5px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pstat{display:flex;gap:10px;font-size:12.5px;color:var(--muted)}
.flag{font-style:normal;font-weight:400;color:var(--bad)}
.spaces{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.space{border:0;background:var(--paper);border-radius:18px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.space:last-child{grid-column:1/-1}
.sp-e{font-size:19px}
.space b{font-weight:400;font-size:18px}
.sp-t{font-size:12.5px;color:var(--blue)}
.sp-d{font-size:13px;color:var(--muted);line-height:1.35}
.seg2{grid-template-columns:repeat(2,1fr)}
.post{gap:8px}
.post h3{margin:0;font-weight:400;font-size:22px;line-height:1.3}
.pbody{white-space:pre-wrap;font-size:16px;line-height:1.65}
.pact{display:flex;align-items:center;gap:12px;border-top:1px solid var(--hair);padding-top:10px;margin-top:4px}
.pact .grow{flex:1}
.like{border:0;background:var(--surface-2);border-radius:999px;padding:7px 14px;font-size:15px}
.like.on{background:var(--blue-soft);color:var(--blue)}
.clist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.clist li{padding:9px 0;border-top:1px solid var(--hair)}
.clist li:first-child{border-top:0;padding-top:0}
.clist p{margin:2px 0 0;font-size:15.5px;white-space:pre-wrap}
.op{font-style:normal;color:var(--blue)}
.linkbtn.sm{font-size:12.5px;padding:0}
.wform{gap:10px}
.fin{font:inherit;font-size:16px;color:var(--ink);background:var(--surface-2);border:2px solid transparent;border-radius:14px;padding:10px 14px;width:100%;resize:vertical}
.fin:focus{outline:none;border-color:var(--blue)}
.cm-err{margin:0;color:var(--bad);font-size:14px;min-height:1em}
.reasons{display:flex;flex-direction:column;gap:6px}
.reasons label{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:15px}
.reasons input{margin-top:5px;accent-color:var(--blue)}
/* v9: 돌마을 (동물의숲 톤은 마을 그림 안에서만) */
.village{position:relative;width:100%;max-width:100%;border-radius:24px;overflow:hidden;touch-action:manipulation;cursor:pointer;user-select:none;-webkit-user-select:none;background:#A9D98B;box-shadow:0 2px 0 var(--hair)}
.vmap{position:absolute;inset:0;width:100%;height:100%;display:block}
.vhit{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;border-radius:14px}
.vhit:focus-visible{outline:3px solid #FFF7E6}
.vbadge{position:absolute;right:2px;top:-2px;background:#E35D5D;color:#fff;font-size:11px;border-radius:999px;padding:1px 7px;border:2px solid #FFF7E6}
.vme,.vpeer{position:absolute;width:14%;transform:translate(-50%,-92%);pointer-events:none;z-index:2}
.vme::before,.vpeer::before{content:"";position:absolute;left:12%;right:12%;bottom:-2%;height:12%;border-radius:50%;background:rgba(0,0,0,.14)}
.bod img{width:100%;display:block}
.vme.left .bod,.vpeer.left .bod{transform:scaleX(-1)}
.vme.walk .bod img{animation:hop .3s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-12%) rotate(-4deg)}}
.vname{position:absolute;left:50%;top:-14px;transform:translateX(-50%);background:#FFF7E6;color:#4A3B2C;font-size:11px;line-height:1.5;padding:0 7px;border-radius:999px;white-space:nowrap;border:1.5px solid #8E6440}
.vme .vname{background:#F6C34A}
.vpeer{transition:left .45s linear,top .45s linear;opacity:.9}
.venter{position:absolute;transform:translate(-50%,-100%);background:#FFF7E6;color:#4A3B2C;border:2px solid #8E6440;border-radius:999px;padding:7px 14px;font-size:15px;box-shadow:0 3px 0 #8E6440;white-space:nowrap;z-index:3;animation:bob 1.2s ease-in-out infinite;cursor:pointer}
@keyframes bob{50%{transform:translate(-50%,-112%)}}
.village.entering::after{content:attr(data-enter);position:absolute;inset:0;background:rgba(255,247,230,.94);display:grid;place-items:center;font-size:19px;color:#4A3B2C;animation:fade .35s ease;z-index:5}
@keyframes fade{from{opacity:0}}
.vhint{margin:-6px 0 0;text-align:center;font-size:13px}
/* v8.1: 사주 통합 */
.ki{background:var(--blue-soft);border-radius:12px;padding:10px 12px}
.ki-l{font-size:12.5px;color:var(--blue)}
.ki p{margin:2px 0 0;font-size:15px;line-height:1.5}
.ki b{font-weight:400;color:var(--blue)}
.fort.flv dt{display:flex;justify-content:space-between;align-items:center}
.dots{color:var(--yellow);letter-spacing:1px;font-size:12px}
.dots i{font-style:normal;color:var(--line)}
.lucky{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.lucky div{background:var(--surface-2);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;min-width:0}
.lucky span{font-size:12.5px;color:var(--muted)}
.lucky b{font-weight:400;font-size:16px}
.hours{display:flex;flex-direction:column;gap:6px}
.hours div{display:flex;justify-content:space-between;align-items:center;gap:8px;border-radius:12px;padding:8px 12px;font-size:14.5px}
.hours b{font-weight:400}
.hours .good{background:var(--gold-soft)}
.hours .bad{background:var(--surface-2)}
.hours .bad span::before{content:"⚡ "}
.hours .good span::before{content:"✨ "}
.mysaju{border-top:0;padding:0;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.mysaju summary{font-size:15px}
.mysaju[open]{display:flex;flex-direction:column;gap:8px}
.mysaju .pils{margin-top:8px}
.elbar{display:flex;flex-direction:column;gap:4px}
.elbar div{display:grid;grid-template-columns:52px 1fr 18px;gap:8px;align-items:center;font-size:13px}
.elbar i{display:block;height:8px;border-radius:999px;min-width:2px}
.b-0{background:var(--good)}.b-1{background:var(--bad)}.b-2{background:#B07A2A}.b-3{background:var(--line)}.b-4{background:var(--blue)}
.elbar b{font-weight:400;text-align:right}
/* v8: 사주 */
.birthbtn{border:0;background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:16px;display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left}
.birthbtn span{color:var(--blue);font-size:20px}
.saju{background:var(--surface-2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.saju-h{display:flex;justify-content:space-between;align-items:baseline}
.saju-h b{font-weight:400;font-size:17px}
.pils{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pil{background:var(--paper);border-radius:12px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
.pil.me{box-shadow:inset 0 0 0 2px var(--blue)}
.pil .pl{font-size:11.5px;color:var(--muted)}
.pil b{font-weight:400;display:flex;flex-direction:column;align-items:center;font-size:24px;line-height:1.15;font-family:"Apple SD Gothic Neo","Noto Serif KR",serif}
.pil b i{font-style:normal}
.pil>span:last-child{font-size:12.5px}
.pil.none b{color:var(--line);font-size:30px;padding:6px 0}
.pil.none>span:last-child{font-size:11px;color:var(--muted)}
.el-wood{color:var(--good)}.el-fire{color:var(--bad)}.el-earth{color:#B07A2A}.el-metal{color:var(--muted)}.el-water{color:var(--blue)}
.saju-b{margin:0;font-size:14.5px;line-height:1.5}
.saju-b b{font-weight:400;color:var(--blue)}
.reasons label.fl{background:none;padding:0;font-size:14px;color:var(--muted);margin-bottom:-2px}
/* v7: 돌뽑기 */
.luck-h h2{font-weight:400;font-size:28px;margin:0;line-height:1.2}
.luck-h p{margin:2px 0 0;color:var(--muted);font-size:15px}
.lcard{background:var(--paper);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.lc-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lc-h b{font-weight:400;font-size:21px}
.done-chip{font-size:12.5px;background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:3px 10px}
.free-chip{font-size:12.5px;background:var(--yellow);color:#18212F;border-radius:999px;padding:3px 10px}
.flip{border:0;padding:0;background:none;width:100%;aspect-ratio:5/4;max-height:300px;perspective:1000px;cursor:pointer}
.flip.open{cursor:default}
.flip-in{position:relative;display:block;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,.9,.3,1);transform-style:preserve-3d}
.flip.open .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px}
.f-front{background:var(--blue);color:var(--blue-ink);background-image:radial-gradient(circle at 20% 20%,rgba(255,255,255,.16) 0 18%,transparent 19%),radial-gradient(circle at 85% 75%,rgba(255,255,255,.12) 0 14%,transparent 15%)}
.f-front b{font-weight:400;font-size:19px}
.f-front .hint{color:var(--blue-ink);opacity:.85}
.mys{position:relative;width:118px;height:118px;display:grid;place-items:center}
.mys svg{width:100%;height:100%;filter:grayscale(1) brightness(.35) opacity(.55)}
.mys i{position:absolute;font-style:normal;font-size:48px;color:var(--yellow)}
.f-back{transform:rotateY(180deg);background:var(--wall)}
.f-back.g-great{background:var(--gold-soft)}
.grade{display:flex;align-items:center;gap:6px;background:var(--blue);color:var(--blue-ink);border-radius:999px;padding:3px 14px}
.grade b{font-weight:400;font-size:22px}
.g-careful .grade{background:var(--coral)}
.face-pb{width:110px;height:110px;position:relative}
.face-pb svg{width:100%;height:100%}
.face-pb.great::after{content:"✦ ✧ ✦";position:absolute;top:-4px;left:50%;transform:translateX(-50%);color:var(--gold);font-size:18px;letter-spacing:6px;white-space:nowrap}
.sum{font-size:16px;text-align:center;line-height:1.35;color:var(--ink)}
.fort{margin:0;display:flex;flex-direction:column;gap:6px}
.fort div{background:var(--surface-2);border-radius:12px;padding:8px 12px}
.fort dt{font-size:13px;color:var(--muted)}
.fort dd{margin:0;font-size:16px}
.lc-f{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lc-f .btn{padding:8px 14px;font-size:15px}
.lcd-row{margin:0;text-align:right}
.ticket{position:relative;height:150px;border-radius:16px;overflow:hidden;background:var(--gold-soft);border:2px dashed var(--gold)}
.t-res{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:10px}
.t-name{font-size:14px;color:var(--muted)}
.t-amt{font-weight:400;font-size:28px;color:var(--blue)}
.t-miss .t-amt{color:var(--muted)}
.t-jackpot .t-amt{color:var(--bad)}
.t-line{font-size:15px}
#scratch{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;transition:opacity .5s ease}
#scratch.gone{opacity:0;pointer-events:none}
.lc-msg{margin:0;font-size:16px;text-align:center}
.pop{position:absolute;left:50%;top:60%;width:22px;height:20px;border-radius:50%;background:url(images/poses/base.png) center 58%/170% no-repeat;animation:pop 1.1s cubic-bezier(.2,.8,.3,1) forwards;pointer-events:none;z-index:3}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}15%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy) + 140px)) rotate(var(--r)) scale(1);opacity:0}}
.odds summary{font-size:14px;color:var(--muted)}
.odds summary::after{font-size:18px}
.odds table{width:100%;font-size:14px;border-collapse:collapse;margin-top:6px}
.odds td{padding:4px 2px;border-top:1px solid var(--hair)}
.odds td:nth-child(n+2){text-align:right}
/* v6: 닉네임·쪽지 */
.mybar{display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:14px;padding:8px 10px 8px 14px;font-size:14.5px}
.mybar .grow{flex:1}
.mynick{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mynick b{font-weight:400;color:var(--blue)}
.chipbtn{border:0;background:var(--surface-2);border-radius:999px;padding:5px 11px;font-size:14px;white-space:nowrap}
.chipbtn.mail{background:var(--blue-soft)}
.nbadge{font-style:normal;display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:11.5px;vertical-align:middle}
.nick{border:0;background:none;padding:0;font:inherit;color:var(--blue);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px}
.rules-s{margin:0;padding-left:18px;font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.flag2{font-weight:400;color:var(--blue)}
.reqbox{background:var(--paper);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 0 0 2px var(--yellow)}
.reqbox p{margin:0;font-size:15px}
.chat{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto}
.chat.sm{max-height:40vh;background:var(--surface-2);border-radius:12px;padding:10px}
.bub{align-self:flex-start;max-width:82%;background:var(--surface-2);border-radius:16px 16px 16px 4px;padding:8px 12px}
.chat.sm .bub{background:var(--paper)}
.chat.sm .bub.me{background:var(--blue-soft);color:var(--ink)}
.bub.me{align-self:flex-end;background:var(--blue);color:var(--blue-ink);border-radius:16px 16px 4px 16px}
.bub p{margin:0;white-space:pre-wrap;font-size:15.5px;line-height:1.45}
.bub span{display:block;font-size:11px;opacity:.7;margin-top:2px}
.entry.ops{font-size:17px;padding:12px 16px}
.chk{background:transparent!important;padding:4px 2px!important}
/* v3: 오늘의 퇴근각 */
.gcard{background:var(--paper);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.gc-h{display:flex;align-items:center;justify-content:space-between}
.gc-h b{font-weight:400;font-size:22px}
.new{background:var(--yellow);color:#18212F;font-size:12px;letter-spacing:.08em;border-radius:999px;padding:2px 9px}
.gc-body{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.gc-topic{background:var(--blue-soft);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;min-width:96px}
.gc-topic span{font-size:12.5px;color:var(--muted)}
.gc-topic b{font-weight:400;font-size:20px;white-space:nowrap}
.gc-copy{margin:0;font-size:17px;line-height:1.4}
.gc-copy b{font-weight:400;color:var(--blue)}
.gc-track{position:relative;height:30px;border-radius:999px;background:var(--surface-2);margin-right:52px}
.gc-track::before{content:"";position:absolute;left:14px;right:6px;top:50%;border-top:2px dashed var(--line)}
.gc-peb{position:absolute;top:50%;width:26px;height:26px;border-radius:50%;background:url(images/poses/base.png) center 60%/150% no-repeat;transform:translate(-50%,-50%);transition:left .6s ease}
.gc-exit{position:absolute;right:-52px;top:0;height:30px;width:46px;border-radius:8px;background:var(--good);color:#fff;font-size:12px;display:grid;place-items:center;letter-spacing:.06em}
.gc-count{margin:0}
.pv{font-size:11px;letter-spacing:.06em;color:var(--blue);background:var(--blue-soft);border-radius:999px;padding:1px 7px;vertical-align:middle}
.gc-rank{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--surface-2);border-radius:12px;padding:8px 12px;font-size:14px}
.gc-rank span{color:var(--muted)}
.gc-rank b{font-weight:400}
.ghead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ghead h2{font-weight:400;font-size:24px;margin:0;line-height:1.2}
.gx{border:0;background:var(--surface-2);border-radius:50%;width:36px;height:36px;font-size:22px;line-height:1;flex:none}
.gscene{position:relative;height:150px;border-radius:16px;background:var(--wall);overflow:hidden}
.gscene::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;background:var(--floor)}
.gdesk{position:absolute;left:6%;bottom:34px;width:58px;height:34px;border-radius:4px 4px 0 0;background:var(--wall-2);box-shadow:inset 0 6px 0 var(--line)}
.gdesk.d2{left:22%;width:44px;height:28px}
.gdoor{position:absolute;right:4%;bottom:34px;width:56px;height:92px;border-radius:6px 6px 0 0;background:var(--paper);box-shadow:inset 0 0 0 3px var(--line);z-index:1}
.gdoor::after{content:"";position:absolute;right:8px;top:48px;width:6px;height:6px;border-radius:50%;background:var(--line)}
.gsign{position:absolute;left:50%;top:-24px;transform:translateX(-50%);white-space:nowrap;background:var(--good);color:#fff;font-size:11px;padding:2px 7px;border-radius:5px}
.gpeb{position:absolute;bottom:28px;width:58px;height:auto;transform:translateX(-50%) rotate(var(--r,0deg));transition:left .9s cubic-bezier(.3,1.25,.45,1),transform .9s ease,opacity .5s ease;z-index:2}
.gpeb.out{left:108%!important;opacity:0;transform:translateX(-50%) rotate(900deg);transition:left .9s ease-in,transform .9s ease-in,opacity .9s ease-in}
.gdist{position:absolute;left:12px;top:10px;font-size:12.5px;background:var(--paper);border-radius:999px;padding:2px 9px;z-index:2}
.gmsg{margin:0;font-size:15.5px;min-height:1.6em}
.gmsg b{font-weight:400;color:var(--blue)}
.gform{display:flex;gap:8px}
.gform input{flex:1;min-width:0;font:inherit;font-size:17px;color:var(--ink);background:var(--surface-2);border:2px solid transparent;border-radius:14px;padding:10px 14px}
.gform input:focus{outline:none;border-color:var(--blue)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.glist-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.glist-h b{font-weight:400}
.glist-h .hint{font-size:12.5px}
.glist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.glist li{display:grid;grid-template-columns:24px minmax(0,1fr) 70px 50px 40px;gap:8px;align-items:center;background:var(--surface-2);border-radius:10px;padding:7px 10px;font-size:15px}
.glist li.last{box-shadow:inset 0 0 0 2px var(--blue)}

/* ---------- v3: 오늘의 퇴근각 (데일리 단어 게임) ----------
   의미 유사도: 단어마다 붙은 의미 태그를 IDF 가중 코사인으로 비교. 서버 없이 기기 안에서 계산해요. */
const TG=(function(){
 const W=window.TG_WORDS||{}, lex={}, topicOf={};
 Object.entries(W).forEach(([k,t])=>t.words.split("|").forEach(e=>{const [w,tags]=e.split(":");const set=lex[w]||(lex[w]=new Set());set.add("#"+k);(tags||"").trim().split(/\s+/).forEach(x=>x&&set.add(x));topicOf[w]=topicOf[w]||k}));
 const words=Object.keys(lex), N=words.length, df={};
 words.forEach(w=>lex[w].forEach(t=>df[t]=(df[t]||0)+1));
 const idf=t=>Math.log((N+1)/(df[t]+1))+0.3;
 const norm={};words.forEach(w=>{let s=0;lex[w].forEach(t=>s+=idf(t)**2);norm[w]=Math.sqrt(s)});
 const cos=(a,b)=>{if(a===b)return 1;let d=0;lex[a].forEach(t=>{if(lex[b].has(t))d+=idf(t)**2});return d/(norm[a]*norm[b])};
 const list=[];const keys=Object.keys(W);const mx=Math.max(...keys.map(k=>W[k].secrets.length));
 for(let i=0;i<mx;i++)keys.forEach(k=>{const w=W[k].secrets[i];if(w&&lex[w])list.push({key:k,secret:w})});
 const rankCache={};
 function ranks(sec){if(rankCache[sec])return rankCache[sec];const r={};words.filter(w=>w!==sec).map(w=>[w,cos(w,sec)]).sort((a,b)=>b[1]-a[1]).forEach(([w],i)=>r[w]=i+1);return rankCache[sec]=r}
 function daily(date){const [y,m,d]=date.split("-").map(Number);const n=Math.floor(Date.UTC(y,m-1,d)/864e5);const p=list[(n*7)%list.length];const t=W[p.key];return {key:p.key,secret:p.secret,name:t.name,emoji:t.emoji,no:n%10000}}
 function normalize(x){x=String(x||"").replace(/\s+/g,"").trim();return (window.TG_ALIAS||{})[x]||x}
 function score(raw,sec){const w=normalize(raw);if(!lex[w])return {w,known:false};const c=cos(w,sec);return {w,known:true,s:w===sec?100:Math.round(c*10000)/100,rank:w===sec?0:ranks(sec)[w]}}
 return {daily,score,normalize,size:N};
})();

};
const GAME_NAMES=["칼퇴돌","몽돌","차돌","짱돌","공깃돌","디딤돌","주춧돌","맷돌","부싯돌","섬돌","자갈대리","몽글돌"];
function gameState(){const d=today();if(!state.game||state.game.date!==d)state.game={date:d,guesses:[],solved:false,solvedAt:null,gaveUp:false};return state.game}
/* 랭킹 미리보기: 서버 연결 전까지는 예시 기록 + 내 기록. 정렬 규칙(시도 수 → 먼저 맞힌 시각)은 실제 랭킹과 같아요. */
function exampleRows(date){const r=rng(hash("rank"+date));let a=3,min=9*60+2;return GAME_NAMES.map((n,i)=>{if(i>0)a+=1+Math.floor(r()*4);min+=Math.floor(r()*35)+3;return {name:n,attempts:a,at:pad(Math.floor(min/60)%24)+":"+pad(min%60)}})}
function challengers(date){const base=9000+hash("ch"+date)%5000,h=new Date().getHours()+new Date().getMinutes()/60;return Math.round(base*(0.35+0.65*Math.min(1,h/18)))}

}
function guessRows(g){

function submitGuess(raw){

 hoodReport(id){modal(`<div class="sec-h"><h2>신고하기</h2><small>운영자에게 전달돼요</small></div><form id="rform" class="reasons">${CM.REPORT_REASONS.map((r,i)=>`<label><input type="radio" name="reason" value="${r.id}" ${i===0?"checked":""}><span>${r.label}${r.hideNow?" <i class='flag'>바로 가림</i>":""}</span></label>`).join("")}<input type="hidden" name="pid" value="${esc(id)}"><div class="confirm-row"><button type="button" class="btn ghost" data-act="close">취소</button><button class="btn danger" type="submit">신고</button></div></form>`);return "noRender"},

 giveUp(){document.getElementById("giveArea").innerHTML=`<div class="confirm-row"><button class="btn ghost" data-act="game">계속 도전</button><button class="btn danger" data-act="giveUpYes">정답 보기</button></div><p class="hint" style="margin:6px 0 0">정답을 보면 오늘 랭킹에는 오를 수 없어요.</p>`;return "noRender"},

 clockIn(){
  const d=state.day;if(d.inAt)return;
  d.inAt=state.demo?"08:52":nowHM();
  state.streak=state.lastWorkDate===prevWorkday(d.date)?state.streak+1:1;
  state.lastWorkDate=d.date;
  const fx={coins:100,mental:wd(d.date)===1?-10:-3,happy:0};
  if(state.equipped.pet)fx.happy+=5;
  state.owned.forEach(i=>{const it=ITEMS.find(x=>x.id===i);if(it&&it.fx&&it.fx.when==="in"){fx.happy+=it.fx.happy||0}});
  applyFx(fx);
  d.inFx=fx;
  state.log[d.date]=Object.assign(state.log[d.date]||{},{in:d.inAt});
  gainXp(20);
  toast(`출근 완료! 코인 +100${wd(d.date)===1?" · 월요병 멘탈 -10":""}${fx.happy?` · 행복 +${fx.happy}`:""}`);
 },
 lunch(){
  const d=state.day;if(d.lunch!=null||!d.inAt)return;
  const tot=EVENTS.reduce((a,e)=>a+e.w,0);let x=Math.random()*tot,i=0;
  for(;i<EVENTS.length;i++){x-=EVENTS[i].w;if(x<0)break}
  d.lunch=Math.min(i,EVENTS.length-1);applyFx(EVENTS[d.lunch].fx);gainXp(5);
 },
 mission(id){
  const d=state.day;if(!d.inAt||d.missions[id])return;
  const m=MISSIONS.find(x=>x.id===id);d.missions[id]=true;applyFx(Object.assign({coins:m.c},m.fx));gainXp(10);
  toast(`미션 완료 · 코인 +${m.c}`);
 },
 clockOut(mode){
  const d=state.day;if(!d.inAt||d.outAt)return;
  const out=state.demo?"18:04":nowHM();
  let worked=mins(out)-mins(d.inAt);if(worked<0)worked+=1440;
  const early=mode==="early";
  if(!state.demo&&worked<240&&!early){
   modal(`<div class="sec-h"><h2>벌써 퇴근하시게요?</h2><small>근무 ${Math.floor(worked/60)}시간 ${worked%60}분</small></div>
   <p class="hint" style="margin:0">출근 4시간 전에 퇴근하면 조퇴로 처리돼요. 기본급이 절반(150)만 나오고 연속출근 수당과 칼퇴 보너스는 없어요. 진짜 조퇴라면 괜찮아요, 그런 날도 있죠.</p>
   <div class="confirm-row"><button class="btn ghost" data-act="close">계속 근무</button><button class="btn" data-act="clockOut:early">조퇴하기</button></div>`);
   return "noRender";
  }
  closeModal();
  d.outAt=out;
  const t=mins(d.outAt);
  const lines=[[early?"기본급 (조퇴 50%)":"기본급",early?150:300]];
  const sb=early?0:Math.min(state.streak,10)*20; if(sb)lines.push([`연속출근 수당 (${state.streak}일)`,sb]);
  let tfx={};
  const kal=!early&&t>=17*60&&t<19*60, night=!early&&(t>=21*60||t<5*60);
  if(kal){lines.push(["칼퇴 보너스",100]);tfx.happy=10}
  else if(night){lines.push(["야근 수당",150]);tfx.mental=-10}
  const total=lines.reduce((a,l)=>a+l[1],0);
  const h=HOUSES[state.house];const rec={happy:tfx.happy||0,mental:(tfx.mental||0)+h.rec};
  state.owned.forEach(i=>{const it=ITEMS.find(x=>x.id===i);if(it&&it.fx&&it.fx.when==="out"){rec.happy+=it.fx.happy||0;rec.mental+=it.fx.mental||0}});
  state.coins+=total;applyFx(rec);state.daysWorked++;
  const mc=todaysMissions().filter(m=>d.missions[m.id]).reduce((a,m)=>a+m.c,0);
  const lc=d.lunch!=null?(EVENTS[d.lunch].fx.coins||0):0;
  const ref=[["근무시간",`${d.inAt} – ${d.outAt}`],["낮 동안 받은 수당",won(100+mc+lc)]];
  if(rec.happy)ref.push(["퇴근 후 행복",(rec.happy>0?"+":"")+rec.happy]);
  if(rec.mental)ref.push([`퇴근 후 멘탈 (${h.name}·가구)`,(rec.mental>0?"+":"")+rec.mental]);
  d.slip={date:d.date,lines,total,ref};
  state.log[d.date]=Object.assign(state.log[d.date]||{},{in:d.inAt,out:d.outAt,total,early,kal,night,missions:Object.keys(d.missions).length});
  gainXp(early?10:30);
  const ms=SEASON.find(s=>s.d===state.daysWorked);
  if(ms){state.coins+=ms.c;state.promoDates[ms.d]=d.date;state.pendingPromo=ms.d}
  modal(`${slipHTML(d.slip,true)}<div class="confirm-row"><button class="btn ghost" data-act="share">공유 카드 만들기</button><button class="btn" data-act="close">${state.pendingPromo?"인사팀 연락 확인":wd(d.date)===5?"월급상자 확인":"확인"}</button></div>`);
 },
 slip(){if(state.day.slip)modal(`${slipHTML(state.day.slip,false)}<div class="confirm-row"><button class="btn ghost" data-act="share">공유 카드 만들기</button><button class="btn" data-act="close">닫기</button></div>`)},

   <div class="confirm-row">${can?`<button class="btn" data-act="shareGo">공유하기</button>`:""}<a class="btn ${can?"ghost":""}" href="${shareURL}" download="toegeunjung-${sl.date}.png" style="text-decoration:none">이미지 저장</a></div>
   <button class="btn ghost wide" data-act="close">닫기</button>`);
  });

 },

 box(){

 openBox(){
  const d=state.day;if(d.box)return;d.box=true;d.boxOpen=true;
  const coins=200+Math.floor(Math.random()*9)*50;state.coins+=coins;
  const prizes=[[`월급코인`,`+${won(coins)}`]];

  if(pool.length){const it=pool[Math.floor(Math.random()*pool.length)];state.owned.push(it.id);prizes.push([it.name,"획득"])}
  else{state.coins+=150;prizes.push(["중복 아이템 환급","+150"])}
  if(Math.random()<0.08){state.coupons.push(d.date);prizes.push(["아메리카노 쿠폰","당첨 (시연용)"])}
  modal(`<div class="sec-h"><h2>월급상자 개봉</h2><small>${d.date.slice(5).replace("-",".")} 금요일</small></div><div class="prize">${prizes.map(p=>`<div><b>${p[0]}</b><span class="mono">${p[1]}</span></div>`).join("")}</div><p class="hint" style="margin:0">커피 쿠폰은 브랜드 스폰서 제휴 후 실제로 지급될 예정이에요.</p><button class="btn wide" data-act="close">좋아요</button>`);
 },

  const it=ITEMS.find(x=>x.id===id);if(!it||state.owned.includes(id))return;
  if(state.coins<it.price){toast(`월급코인이 ${won(it.price-state.coins)} 부족해요. 출근과 미션으로 모아보세요`);return}
  state.coins-=it.price;state.owned.push(id);if(it.slot)state.equipped[it.slot]=id;toast(`${it.name} 구매 완료`);
 },
 equip(id){const it=ITEMS.find(x=>x.id===id);if(it&&state.owned.includes(id))state.equipped[it.slot]=id},
 unequip(slot){state.equipped[slot]=null},
 house(lv){
  lv=Number(lv);const h=HOUSES[lv];if(!h||lv!==state.house+1)return;
  if(state.coins<h.price){toast(`이사 자금이 ${won(h.price-state.coins)} 부족해요`);return}
  state.coins-=h.price;state.house=lv;toast(`${h.name}(으)로 이사했어요`);
 },
 night(){if(!(state.demo||new Date().getHours()>=18))return;state.day.night=!state.day.night;toast(state.day.night?"야근중 상태를 켰어요. 같은 동네 돌들에게 보여요":"야근중 상태를 껐어요")},
 cheer(){const d=state.day;if(d.cheers>=5){toast("오늘 응원은 5번까지 보낼 수 있어요");return}d.cheers++;applyFx({happy:2});toast(`${state.district} 야근 돌에게 응원을 보냈어요 · 행복 +2`)},
 demo(){state.demo=!state.demo;if(state.demo){state.demoDate=ymd(new Date())}toast(state.demo?"체험 모드를 켰어요":"실제 시간 모드로 돌아왔어요")},
 reset(){document.getElementById("resetArea").innerHTML=`<p class="hint" style="margin:0 0 8px">코인, 아이템, 근속 기록이 모두 사라져요.</p><div class="confirm-row"><button class="btn ghost" data-act="tab:drawer">취소</button><button class="btn danger" data-act="resetYes">초기화</button></div>`;return "noRender"},
 resetYes(){state=fresh();ensureDay();toast("처음부터 다시 시작해요")},
 close(){
  if(state.pendingPromo){const p=state.pendingPromo;state.pendingPromo=null;save();modal(promoHTML(p));render();return "noRender"}
  closeModal();render();return "noRender"},
};
document.addEventListener("click",e=>{
 const el=e.target.closest("[data-act]");if(!el)return;
 if(el.classList.contains("scrim")&&e.target!==el)return;
 const [name,arg]=el.dataset.act.split(":");
 if(!act[name]||el.disabled)return;
 const r=act[name](arg);
 save();
 if(r!=="noRender")render();
 if(name==="clockOut"||name==="box"||name==="openBox"){/* modal already open */}
});
/* ----- 마을 이동 ----- */
const VIL={x:0,y:0,tx:null,ty:null,raf:0,keys:{},last:0,near:null,pres:0};
function vEls(){return {box:document.getElementById("village"),me:document.getElementById("vme"),btn:document.getElementById("venter"),peers:document.getElementById("vpeers")}}
function vPlace(){const {me}=vEls();if(!me)return;me.style.left=pct(VIL.x,VG.W);me.style.top=pct(VIL.y,VG.H)}
function vNear(){let best=null,bd=1e9;VG.PLACES.forEach(p=>{const d=Math.hypot(p.door.x-VIL.x,p.door.y-VIL.y);if(d<bd){bd=d;best=p}});return bd<=30?best:null}
function vShowEnter(){const {btn}=vEls();if(!btn)return;const p=vNear();VIL.near=p;
 if(!p){btn.hidden=true;return}
 btn.hidden=false;btn.textContent=`${p.emoji} ${p.name} 들어가기`;btn.style.left=pct(p.door.x,VG.W);btn.style.top=pct(Math.max(40,p.hit.y-4),VG.H);btn.dataset.place=p.id}
function vPresence(force){const now=Date.now();if(!force&&now-VIL.pres<350)return;VIL.pres=now;CM.presence({x:Math.round(VIL.x),y:Math.round(VIL.y),nick:CM.state.me.nick||"돌"})}
function vLoop(t){
 const {me}=vEls();if(!me){VIL.raf=0;return}
 const dt=Math.min(.05,(t-(VIL.last||t))/1000);VIL.last=t;
 let dx=0,dy=0;const k=VIL.keys;
 if(k.ArrowLeft||k.a)dx-=1;if(k.ArrowRight||k.d)dx+=1;if(k.ArrowUp||k.w)dy-=1;if(k.ArrowDown||k.s)dy+=1;
 const SPD=120;let moving=false;
 if(dx||dy){const l=Math.hypot(dx,dy);VIL.x+=dx/l*SPD*dt;VIL.y+=dy/l*SPD*dt;VIL.tx=null;moving=true;if(dx)me.classList.toggle("left",dx<0)}
 else if(VIL.tx!=null){const ddx=VIL.tx-VIL.x,ddy=VIL.ty-VIL.y,d=Math.hypot(ddx,ddy);
  if(d<2){VIL.x=VIL.tx;VIL.y=VIL.ty;VIL.tx=null}else{const st=Math.min(d,SPD*dt);VIL.x+=ddx/d*st;VIL.y+=ddy/d*st;moving=true;if(Math.abs(ddx)>1)me.classList.toggle("left",ddx<0)}}
 const B=VG.BOUNDS;VIL.x=Math.max(B.x0,Math.min(B.x1,VIL.x));VIL.y=Math.max(B.y0,Math.min(B.y1,VIL.y));
 me.classList.toggle("walk",moving);vPlace();vShowEnter();
 const h=hood();h.pos={x:Math.round(VIL.x),y:Math.round(VIL.y)};
 if(moving){vPresence(false);VIL.raf=requestAnimationFrame(vLoop)}else{vPresence(true);VIL.raf=0;VIL.last=0}
}
function vGo(x,y){VIL.tx=x;VIL.ty=y;if(!VIL.raf){VIL.last=0;VIL.raf=requestAnimationFrame(vLoop)}}
function vEnter(id){
 const p=VG.PLACES.find(x=>x.id===id);if(!p)return;const {box}=vEls();
 const h=hood();h.pos={x:p.door.x,y:Math.min(VG.BOUNDS.y1,p.door.y+14)};
 const go=()=>{if(p.kind==="space")Object.assign(h,{v:"space",space:p.id,pid:null});else if(p.kind==="board")h.v="board";else{h.v="inbox";if(!h.tab)h.tab="talk"}save();render();window.scrollTo(0,0)};
 if(box&&!matchMedia("(prefers-reduced-motion: reduce)").matches){box.dataset.enter=`${p.emoji} ${p.name}에 들어가는 중…`;box.classList.add("entering");setTimeout(go,420)}else go();
}
function vPeers(){const {peers}=vEls();if(!peers)return;const ps=CM.state.peers||[];
 const have=new Set();ps.forEach(p=>{have.add(p.key);let el=peers.querySelector(`[data-peer="${CSS.escape(p.key)}"]`);
  if(!el){el=document.createElement("div");el.className="vpeer";el.dataset.peer=p.key;el.innerHTML=`<div class="bod"><img src="images/poses/base.png" alt=""></div><span class="vname"></span>`;peers.appendChild(el)}
  el.style.left=pct(p.x,VG.W);el.style.top=pct(p.y,VG.H);el.querySelector(".vname").textContent=p.nick||"돌"});
 [...peers.children].forEach(el=>{if(!have.has(el.dataset.peer))el.remove()})}
function updateVillage(){
 VG.PLACES.forEach(p=>{const b=document.querySelector(`[data-vbadge="${p.id}"]`);if(!b)return;const n=placeNew(p);b.hidden=!n;b.textContent=n});
 const oc=document.querySelector(".vhead .online");if(oc)oc.outerHTML=onlineChip();
 const mb=document.querySelector(".mybar");if(mb)mb.outerHTML=myBar();
 vPeers();
}
function initVillage(){
 const {box}=vEls();if(!box||box.dataset.ready)return;box.dataset.ready="1";
 const h=hood(),pos=h.pos||VG.SPAWN;VIL.x=pos.x;VIL.y=pos.y;VIL.tx=null;VIL.keys={};vPlace();vShowEnter();vPeers();vPresence(true);
 box.addEventListener("click",e=>{
  const en=e.target.closest(".venter");if(en){vEnter(en.dataset.place);return}
  const hit=e.target.closest(".vhit");const r=box.getBoundingClientRect();
  if(hit){const p=VG.PLACES.find(x=>x.id===hit.dataset.vplace);if(p){if(VIL.near&&VIL.near.id===p.id){vEnter(p.id);return}vGo(p.door.x,Math.min(VG.BOUNDS.y1,p.door.y+6))}return}
  vGo((e.clientX-r.left)/r.width*VG.W,(e.clientY-r.top)/r.height*VG.H);
 });
}
document.addEventListener("keydown",e=>{
 if(!document.getElementById("village")||document.getElementById("modal").innerHTML)return;
 const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;
 const k=e.key.length===1?e.key.toLowerCase():e.key;
 if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","w","a","s","d"].includes(k)){e.preventDefault();VIL.keys[k]=true;if(!VIL.raf){VIL.last=0;VIL.raf=requestAnimationFrame(vLoop)}}
 if((k==="Enter"||k===" ")&&VIL.near&&!(a&&a.closest&&a.closest(".vhit,.venter,button"))){e.preventDefault();vEnter(VIL.near.id)}
});
document.addEventListener("keyup",e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;delete VIL.keys[k]});
let dmDraft={anon:null,warned:false};
function scrollChat(){const b=document.getElementById("chatbox");if(b)b.scrollTop=b.scrollHeight}
function keepDraft(){const t=document.getElementById("wtitle"),b=document.getElementById("wbody"),h=hood();if(t)h.dTitle=t.value;if(b)h.dBody=b.value}
document.addEventListener("submit",e=>{
 const f=e.target;
 if(f.id==="wform"){e.preventDefault();keepDraft();const h=hood(),btn=f.querySelector('[type=submit]');btn.disabled=true;
  CM.addPost({space:h.space||"toilet",title:h.dTitle,body:h.dBody}).then(id=>{Object.assign(h,{v:"post",pid:id,dTitle:"",dBody:""});save();render();toast("글을 올렸어요");window.scrollTo(0,0)})
  .catch(err=>{btn.disabled=false;const el=document.getElementById("werr");if(el)el.textContent=err&&["space","title","body","cooldown"].includes(err.code)?err.message:err&&err.code==="invalid_argument"?"글을 올릴 권한이 없어요.":err&&err.code==="quota_exceeded"?"저장 공간이 가득 찼어요.":"올리지 못했어요. 잠시 뒤 다시 해 주세요."});return}
 if(f.id==="cform"){e.preventDefault();const i=document.getElementById("cin"),v=i.value;if(!v.trim())return;i.value="";CM.addComment(hood().pid,v).catch(err=>{i.value=v;toast(err&&err.code==="body"?err.message:"댓글을 달지 못했어요")});return}
 if(f.id==="bform"){e.preventDefault();const d=document.getElementById("bdate").value,nt=document.getElementById("bnotime").checked,t=nt?"":document.getElementById("btime").value,err=document.getElementById("berr");
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||d<"1930-01-01"||d>LK.kstDate()){err.textContent="생년월일을 확인해 주세요.";return}
  const L=luckState();L.birth={date:d,time:t||null};save();closeModal();
  toast(L.fortune.result&&L.fortune.upgraded?"저장했어요. 오늘 운세는 이미 사주로 바꿔서, 새 생년월일은 내일부터 적용돼요":L.fortune.result?"저장했어요. 오늘 운세를 내 사주로 다시 풀었어요":"저장했어요. 이제 내 사주로 운세를 봐요");render();return}
 if(f.id==="nform"){e.preventDefault();const v=document.getElementById("nin").value,h=hood();h.dNick=v;const btn=f.querySelector('[type=submit]');btn.disabled=true;
  CM.setNickname(v).then(()=>{toast("닉네임을 바꿨어요");Object.assign(h,{v:h.from==="write"?"write":"main",dNick:null});render()}).catch(err=>{btn.disabled=false;const el=document.getElementById("nerr");if(el)el.textContent=err&&err.message&&err.code?String(err.message):"바꾸지 못했어요. 잠시 뒤 다시 해 주세요."});return}
 if(f.id==="dmfirst"){e.preventDefault();const v=document.getElementById("dmfin").value,err=document.getElementById("dmerr");
  if(CM.contactRisk(v)&&!dmDraft.warned){dmDraft.warned=true;err.textContent="연락처처럼 보이는 내용이 있어요. 익명 커뮤니티에서는 연락처를 주고받지 않는 걸 권해요. 그래도 보내려면 한 번 더 누르세요.";return}
  const btn=f.querySelector('[type=submit]');btn.disabled=true;
  CM.startDm(dmDraft.anon,v).then(cid=>{closeModal();toast("쪽지를 보냈어요. 상대가 수락하면 대화가 열려요");Object.assign(hood(),{v:"chat",cid});render()}).catch(x=>{btn.disabled=false;err.textContent=(x&&x.code==="dm")?x.message:"보내지 못했어요. 잠시 뒤 다시 해 주세요."});return}
 if(f.id==="dmform"){e.preventDefault();const i=document.getElementById("dmin"),v=i.value;if(!v.trim())return;
  if(CM.contactRisk(v)&&i.dataset.warned!=="1"){i.dataset.warned="1";toast("연락처처럼 보여요. 그래도 보내려면 한 번 더 보내기를 누르세요");return}
  i.value="";i.dataset.warned="";const cid=hood().cid;CM.sendDm(cid,v).then(()=>{CM.markRead(cid)}).catch(x=>{i.value=v;toast((x&&x.code==="dm")?x.message:"보내지 못했어요")});return}
 if(f.id==="dmrform"){e.preventDefault();const fd=new FormData(f),cid=fd.get("cid"),c=CM.convList().find(x=>x.cid===cid);closeModal();
  CM.reportDm(cid,fd.get("reason")).then(()=>toast("신고가 접수됐어요")).catch(x=>toast((x&&x.code==="dm")?x.message:"신고하지 못했어요")).finally(()=>{if(fd.get("alsoBlock")&&c)CM.block(c.other).then(()=>render())});return}
 if(f.id==="rform"){e.preventDefault();const fd=new FormData(f);closeModal();CM.report(fd.get("pid"),fd.get("reason")).then(()=>{toast("신고가 접수됐어요. 고마워요");render()}).catch(()=>toast("신고하지 못했어요"));return}
});
document.addEventListener("submit",e=>{if(e.target.id==="gform"){e.preventDefault();const i=document.getElementById("gin");submitGuess(i.value);i.value="";if(!gameState().solved)i.focus()}});
document.addEventListener("change",e=>{if(e.target.id==="bnotime"){const t=document.getElementById("btime");if(t){t.disabled=e.target.checked;if(e.target.checked)t.value=""}}});
document.addEventListener("change",e=>{const el=e.target;if(el.dataset.change==="offTime"){state.offTime=el.value;save();toast(`퇴근 시간을 ${el.value}로 맞췄어요`)}});
setInterval(()=>{const els=document.querySelectorAll(".lcd");if(els.length){const t=hms(LK.msToReset()/1000);els.forEach(e=>e.textContent=t);if(state.luck&&state.luck.fortune.date&&state.luck.fortune.date!==LK.kstDate()&&state.tab==="luck"&&!document.getElementById("modal").innerHTML)render()}},1000);
setInterval(()=>{const c=document.getElementById("cd");if(c&&state.day.inAt&&!state.day.outAt)c.innerHTML=countdownText()},1000);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.getElementById("modal").innerHTML)act.close()});
setInterval(()=>{if(!state.demo&&!document.getElementById("modal").innerHTML){const prev=state.day&&state.day.date;ensureDay();if(state.day.date!==prev)render();else{const c=document.querySelector(".clock");if(c)c.outerHTML=header().match(/<div class="clock">[\s\S]*?<\/div>/)[0]}}},30000);
const LIVE_INPUTS=["cin","dmin"];
CM.subscribe(()=>{if(state.tab!=="local"||document.getElementById("modal").innerHTML)return;if(hood().v==="main"&&document.getElementById("village")){updateVillage();return}const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&!LIVE_INPUTS.includes(a.id)){pendingCm=true;return}
 const kept={};LIVE_INPUTS.forEach(id=>{const el=document.getElementById(id);if(el)kept[id]=el.value});const focus=a&&LIVE_INPUTS.includes(a.id)?a.id:null;
 const h=hood();if(h.v==="chat"&&h.cid)CM.markRead(h.cid);
 render();LIVE_INPUTS.forEach(id=>{const el=document.getElementById(id);if(el&&kept[id])el.value=kept[id]});if(focus){const el=document.getElementById(focus);if(el)el.focus()}if(h.v==="chat")scrollChat()});
let pendingCm=false;document.addEventListener("focusout",()=>{if(pendingCm){pendingCm=false;setTimeout(()=>{const a=document.activeElement;if(!(a&&/INPUT|TEXTAREA/.test(a.tagName))&&state.tab==="local")render()},0)}});
CM.init();
render();
})();
</script>

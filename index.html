<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>돌대리는 퇴근중</title>
<meta name="description" content="출근하면 조약돌 돌대리도 출근한다. 직장인 출퇴근 연동 캐릭터 육성 게임.">
<meta name="theme-color" content="#EDF2F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="돌대리">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}
</style>
<style>
/* Layout: one-column phone app. Cool, quiet sky palette so the grey pebble character reads clearly; blue stays the brand; one typeface; white cards on pale ground. */
:root{
  --bg:#EDF2F8; --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F1F5FA; --ink:#18212F; --muted:#5A6576; --hair:#DCE3ED; --line:#B9C5D6;
  --blue:#3557D8; --blue-dark:#2440AE; --blue-ink:#FFFFFF; --blue-soft:#E2E9FB;
  --yellow:#FFC83D; --gold:#FFC83D; --gold-soft:#FFF3D1; --pink:#F06A97; --coral:#F38B5B; --good:#1E9566; --bad:#DD4A4A;
  --potato:#E3BE84; --potato-dark:#C8975A;
  --wall:#D5E6F6; --wall-2:#C3D9EF; --floor:#9EBEE3; --window:#FFF4CF; --river:#4F7FCF; --skyline:#8FA9CC; --curtain:#F3B6C7; --rug:#F7FAFE;
  --hoodie:#5C8FD8; --hoodie-dark:#3F6FB8; --navy:#26324D; --shirt:#FFFFFF; --tie:#E0485A; --beanie:#E0485A; --beanie-dark:#B8323F;
  --leaf:#2F9561; --pot:#26324D; --machine:#26324D; --poster:#3557D8; --wood:#8A6A4C;
  --hamster:#F2B66E; --hamster-belly:#FFF0D9; --cat:#7D8594; --dog:#D69A62; --dog-dark:#8F5E33;
  --night-bg:#26324D; --night-ink:#EEF2FA; --night-muted:#B6C1D6;
  --font:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --display:var(--font); --body:var(--font); --mono:var(--font);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111723; --paper:#1A2232; --surface:#1A2232; --surface-2:#222C3F; --ink:#ECF1F8; --muted:#A1ACBE; --hair:#2B364B; --line:#3A4760;
  --blue:#6E8EF5; --blue-dark:#4D6CD6; --blue-ink:#0F1524; --blue-soft:#24304D;
  --gold-soft:#3A3120; --good:#45C08A; --bad:#F07575;
  --wall:#283651; --wall-2:#22304A; --floor:#1C2840; --window:#3B4A6E; --river:#2F4F86; --skyline:#41557A; --curtain:#8F5E70; --rug:#2E3B57;
  --navy:#3C4B70; --night-bg:#0B1020;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111723; --paper:#1A2232; --surface:#1A2232; --surface-2:#222C3F; --ink:#ECF1F8; --muted:#A1ACBE; --hair:#2B364B; --line:#3A4760;
  --blue:#6E8EF5; --blue-dark:#4D6CD6; --blue-ink:#0F1524; --blue-soft:#24304D;
  --gold-soft:#3A3120; --good:#45C08A; --bad:#F07575;
  --wall:#283651; --wall-2:#22304A; --floor:#1C2840; --window:#3B4A6E; --river:#2F4F86; --skyline:#41557A; --curtain:#8F5E70; --rug:#2E3B57;
  --navy:#3C4B70; --night-bg:#0B1020;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:anywhere}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.defs{position:absolute;width:0;height:0;overflow:hidden}
.app{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:12px 112px;display:flex;flex-direction:column;gap:16px}
.mono{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:4px}
.brand{display:flex;align-items:center;gap:6px;font-size:32px;line-height:1;letter-spacing:-.5px}
.brand svg{width:40px;height:44px}
.brand .bn{display:flex;flex-direction:column;white-space:nowrap}.brand .bn small{font-size:13px;color:var(--muted);letter-spacing:0;margin-bottom:3px}
.top .coin{white-space:nowrap}
.top-r{display:flex;align-items:center;gap:10px}
.coin{display:inline-flex;align-items:center;gap:6px;background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 12px 5px 5px;font-size:16px;box-shadow:0 1px 0 var(--hair)}
.coin i{width:24px;height:24px;border-radius:50%;background:var(--yellow);display:inline-grid;place-items:center;font-style:normal;font-size:12px;color:#18212F}
.clock{font-size:13px;color:var(--muted);text-align:right;line-height:1.3}

.hero{background:var(--paper);border-radius:24px;overflow:hidden}
.scene{position:relative}
.scene svg{display:block;width:100%;height:auto}
.status{position:absolute;left:12px;top:12px;background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:14px;display:flex;align-items:center;gap:7px;box-shadow:0 2px 8px rgba(24,33,47,.08)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--good)}
.dot.done{background:var(--blue)}
.badge{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:14px 18px 18px}
.badge .who{grid-row:span 2;display:flex;flex-direction:column;justify-content:center}
.badge .who b{font-weight:400;font-size:26px;line-height:1.05}
.badge .who span{font-size:12px;letter-spacing:.12em;color:var(--blue);text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.chip{font-size:13px;background:var(--surface-2);border-radius:999px;padding:2px 10px;white-space:nowrap;color:var(--ink)}
.bars{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.bar label{display:flex;justify-content:space-between;font-size:14px}
.bar label b{font-weight:400}
.track{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.fill{height:100%;border-radius:999px;transition:width .5s ease}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-top:4px}
.sec-h h2{font-weight:400;font-size:24px;margin:0;line-height:1.15}
.sec-h small{color:var(--muted);font-size:13.5px}
.steps{display:flex;flex-direction:column;background:var(--paper);border-radius:20px;padding:4px 16px}
.step{display:grid;grid-template-columns:32px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--hair)}
.step:last-child{border-bottom:0}
.num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:var(--surface-2);color:var(--muted)}
.step.done .num{background:var(--blue);color:var(--blue-ink)}
.step.now .num{background:var(--yellow);color:#18212F}
.step-b{min-width:0;display:flex;flex-direction:column;gap:8px}
.step-t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.step-t b{font-weight:400;font-size:19px}
.step-t span{font-size:13.5px;color:var(--muted)}
.btn{border:0;border-radius:14px;padding:12px 16px;font-size:17px;font-weight:400;background:var(--blue);color:var(--blue-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s;box-shadow:0 3px 0 var(--blue-dark)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--blue-dark)}
.btn.ghost{background:var(--surface-2);color:var(--ink);box-shadow:none}
.btn.gold{background:var(--yellow);color:#18212F;box-shadow:0 3px 0 #D9A21C}
.btn.danger{background:var(--bad);color:#fff;box-shadow:none}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.wide{width:100%}
.hint{font-size:13.5px;color:var(--muted)}
.event{background:var(--surface-2);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.event q{font-size:18px;quotes:none;line-height:1.3}
.fx{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.fx span{font-size:13px;padding:1px 9px;border-radius:999px;background:var(--paper)}
.fx .up{color:var(--good)} .fx .down{color:var(--bad)} .fx .c{background:var(--yellow);color:#18212F}
.mission{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;border-radius:14px;background:var(--surface-2);width:100%;text-align:left}
.mission .box{width:24px;height:24px;border-radius:50%;background:var(--paper);display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 2px var(--line)}
.mission.on .box{background:var(--good);box-shadow:none;color:#fff}
.mission .m{flex:1;min-width:0;font-size:16px}
.mission .r{font-size:13.5px;background:var(--gold-soft);padding:0 8px;border-radius:999px}
.mission.on .m{text-decoration:line-through;color:var(--muted)}
.mission[disabled]{cursor:default}
.mission[disabled]:not(.on){opacity:.5}
.clear{background:var(--blue);color:var(--blue-ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.clear h3{margin:0;font-weight:400;font-size:34px;line-height:1}
.clear p{margin:0;font-size:15px}
.clear .btn.ghost{background:var(--paper);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.demo-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--gold-soft);border-radius:14px;padding:8px 12px;font-size:14px}

.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--paper);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:10px;padding:9px 0;font-size:16px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--blue-ink)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--paper);border-radius:18px;padding:10px 10px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.thumb{background:var(--wall);border-radius:12px;aspect-ratio:1/1;max-width:100%;display:grid;place-items:center;overflow:hidden}
.thumb svg{width:88%;height:88%}
.thumb img.t3d{width:86%;height:86%;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(20,30,60,.15))}
.card b{font-weight:400;font-size:17px}
.card .d{font-size:13px;color:var(--muted);min-height:2.6em}
.card .btn{padding:9px 10px;font-size:15px}
.tag{font-size:13px;color:var(--good)}

.panel{background:var(--paper);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.panel>b{font-weight:400;font-size:20px}
.preview{font-size:12px;letter-spacing:.1em;color:var(--blue);text-transform:uppercase}
.districts{display:flex;flex-wrap:wrap;gap:6px}
.districts button{border:0;background:var(--surface-2);border-radius:999px;padding:6px 13px;font-size:15px}
.districts button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.big{font-size:40px;line-height:1.05}
.big small{font-size:15px;color:var(--muted)}
.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{background:var(--surface-2);border-radius:12px;padding:8px 10px}
.mini b{display:block;font-weight:400;font-size:18px}
.mini span{font-size:12.5px;color:var(--muted)}
.night{background:var(--night-bg);color:var(--night-ink);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.night .hint,.night .big small{color:var(--night-muted)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch b{font-weight:400;font-size:18px}
.tog{width:54px;height:30px;border-radius:999px;border:0;background:rgba(255,255,255,.25);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.tog[aria-pressed="true"]{background:var(--yellow)}
.tog[aria-pressed="true"]::after{left:27px}
.tog.light{background:var(--line)}
.tog.light[aria-pressed="true"]{background:var(--blue)}
.roadmap{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--paper);border-radius:12px;padding:4px}
.roadmap div{text-align:center;font-size:13px;padding:6px 2px;border-radius:9px;color:var(--muted)}
.roadmap div.on{background:var(--yellow);color:#18212F}

.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.links a{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);background:var(--surface-2);border-radius:14px;padding:10px 12px}
.links a b{font-weight:400;font-size:17px}
.links a span{font-size:13px;color:var(--muted)}
details{border-top:1px solid var(--hair);padding:11px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-size:17px;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--blue);font-size:22px}
details[open] summary::after{content:"–"}
details ul{margin:8px 0 0;padding-left:18px;font-size:15px;display:flex;flex-direction:column;gap:6px}
details .law{font-size:12.5px;color:var(--blue);margin-top:6px}
.coupon{display:flex;justify-content:space-between;align-items:center;border:2px dashed var(--gold);border-radius:12px;padding:10px 12px;background:var(--gold-soft);font-size:15px}

.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--hair);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tabbar nav{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{border:0;background:transparent;padding:9px 0 11px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--muted)}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--blue)}

.scrim{position:fixed;inset:0;background:rgba(17,23,35,.55);display:grid;place-items:end center;z-index:20;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{width:100%;max-width:428px;background:var(--paper);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto;animation:up .28s ease}
.sheet>*{flex-shrink:0}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.slip{border:1px solid var(--hair);border-radius:14px;overflow:hidden}
.slip-h{display:flex;justify-content:space-between;align-items:flex-end;padding:12px 14px;background:var(--surface-2)}
.slip-h b{font-weight:400;font-size:22px}
.slip-h span{font-size:12.5px;color:var(--muted);text-align:right;line-height:1.35}
.slip table{width:100%;border-collapse:collapse;font-size:15px}
.slip td{padding:7px 14px;border-top:1px solid var(--hair)}
.slip td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.slip tr.sub td{color:var(--muted);font-size:13.5px}
.slip tr.total td{background:var(--gold-soft);font-size:17px}
.slip-wrap{position:relative}
.stamp{position:absolute;right:14px;top:50px;border:3px solid var(--bad);color:var(--bad);font-size:20px;padding:2px 10px;border-radius:8px;transform:rotate(-10deg);animation:stamp .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes stamp{from{transform:rotate(-10deg) scale(2);opacity:0}}
.boxart{display:grid;place-items:center;padding:8px 0;background:var(--wall);border-radius:16px}
.boxart svg{width:150px;height:150px}
.shake{animation:shake .6s ease}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
.prize{display:flex;flex-direction:column;gap:8px}
.prize div{display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.prize b{font-weight:400}
.toasts{position:fixed;left:0;right:0;bottom:calc(78px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:6px;z-index:30;pointer-events:none;padding-inline:16px}
.toast{background:var(--ink);color:var(--bg);padding:10px 15px;border-radius:12px;font-size:15px;max-width:420px;animation:up .25s ease}
.confirm-row{display:flex;gap:10px}
.confirm-row .btn{flex:1}
/* v2: season bar */
.season{grid-column:1/-1;margin-top:12px;background:var(--surface-2);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.season-t{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 8px;font-size:14px}
.season-t b{white-space:nowrap}
.season-t b{font-weight:400;font-size:15px}
.season-t span{color:var(--muted);font-size:13px}
.season .track{height:8px;position:relative;overflow:visible;background:var(--paper)}
.season .fill{background:var(--yellow)}
.season .pin{position:absolute;top:-3px;width:14px;height:14px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 2px var(--line);transform:translateX(-50%)}
.season .pin.got{background:var(--blue);box-shadow:none}
/* v2: onboarding */
.onb{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;display:flex;justify-content:center}
.onb-in{width:100%;max-width:460px;padding:24px 20px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;min-height:100%}
.onb-dots{display:flex;gap:6px;justify-content:center}
.onb-dots i{width:8px;height:8px;border-radius:999px;background:var(--line)}
.onb-dots i.on{width:22px;background:var(--blue)}
.onb-art{background:var(--wall);border-radius:24px;display:grid;place-items:center;padding:16px 0 8px}
.onb-art img{width:62%;height:auto}
.onb h1{font-weight:400;font-size:30px;line-height:1.2;margin:0}
.onb p{margin:0;font-size:16.5px;color:var(--muted)}
.onb .eyebrow{font-size:12.5px;letter-spacing:.12em;color:var(--blue);text-transform:uppercase}
.onb .grow{flex:1}
.rules{display:flex;flex-direction:column;gap:8px;background:var(--paper);border-radius:20px;padding:12px 14px}
.rules div{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;font-size:16px}
.rules div span{color:var(--muted);font-size:13.5px;display:block}
.rules div span.num{display:grid;background:var(--yellow);color:#18212F;font-size:16px}
/* v2: attendance book */
.cal-h{display:flex;align-items:center;justify-content:space-between}
.cal-h b{font-weight:400;font-size:20px}
.cal-nav{border:0;background:var(--surface-2);border-radius:10px;width:36px;height:36px;font-size:18px}
.cal-nav[disabled]{opacity:.35}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:12.5px;color:var(--muted);padding:2px 0}
.cal .wd.sun{color:var(--bad)}
.cal .c{aspect-ratio:1/1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;background:var(--surface-2);color:var(--muted);line-height:1.1;min-width:0}
.cal .c.blank{background:transparent}
.cal .c.work{background:var(--blue);color:var(--blue-ink)}
.cal .c.early{background:var(--blue-soft);color:var(--ink)}
.cal .c.night{background:var(--night-bg);color:var(--night-ink)}
.cal .c.rest{background:var(--gold-soft);color:var(--ink)}
.cal .c.today{box-shadow:inset 0 0 0 2px var(--yellow)}
.cal .c small{font-size:10px;opacity:.85}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ranks{display:flex;flex-direction:column}
.rank{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--hair)}
.rank:first-child{border-top:0}
.rank .d{font-size:13px;color:var(--muted);text-align:center;background:var(--surface-2);border-radius:10px;padding:4px 0}

}

const LK=window.TG_LUCK;
function luckState(){
 if(!state.luck)state.luck={secret:LK.newSecret(),fortune:{},lotto:{}};
 const L=state.luck,d=LK.kstDate();
 if(L.fortune.date!==d)L.fortune={date:d,flipped:false,claimed:false};
 if(L.lotto.date!==d)L.lotto={date:d,scratched:false,claimed:false};
 return L;
}
const coinLabel=n=>`월급코인 +${won(n)}`;
/* v36: 조약돌 도감 · 운세 미션 */
function dexState(){if(!state.dex)state.dex={have:{},since:0,days:{},rewards:{}};return state.dex}
const STONE_BY=Object.fromEntries(LK.STONES.map(s=>[s.id,s]));
const tierIds=t=>LK.STONES.filter(s=>s.tier===t).map(s=>s.id);
const DEX_REWARDS=[
 {id:"common",t:"흔함 15종",title:"자갈 수집가",coins:300,ids:tierIds("common")},
 {id:"rare1",t:"보통 9종",title:"돌 감별사",coins:500,ids:tierIds("rare1")},
 {id:"rare2",t:"희귀 5종",title:"원석 사냥꾼",coins:800,ids:tierIds("rare2")},
 {id:"legend",t:"전설 황금연봉돌",title:"황금 연봉",coins:500,ids:["s30"]},
 {id:"all",t:"30종 전부",title:"돌 박사",coins:2000,ids:LK.STONES.map(s=>s.id)}];
const dexDone=(r,have)=>r.ids.every(id=>have[id]||(Array.isArray(have)&&have.includes(id)));
function dexTitles(list){const have=Array.isArray(list)?Object.fromEntries(list.map(x=>[x,1])):list;return DEX_REWARDS.filter(r=>r.ids.every(id=>have[id])).map(r=>r.title)}
function todayStone(){const L=luckState(),D=dexState(),d=L.lotto.date;if(D.days[d])return D.days[d];
 const r=LK.stoneDraw(L.secret,d,D.since,!!D.have.s30);return {id:r.stone.id,pity:r.pity,preview:true}}
function claimStone(){const L=luckState(),D=dexState(),d=L.lotto.date;if(D.days[d])return D.days[d];
 const t=todayStone(),dup=!!D.have[t.id];D.have[t.id]=(D.have[t.id]||0)+1;D.since=t.id==="s30"?0:D.since+1;
 const rec={id:t.id,dup,pity:t.pity};D.days[d]=rec;if(dup)state.coins+=LK.STONE_DUP_COIN;
 const got=[];DEX_REWARDS.forEach(r=>{if(!D.rewards[r.id]&&r.ids.every(id=>D.have[id])){D.rewards[r.id]=d;state.coins+=r.coins;got.push(r)}});rec.got=got.map(r=>r.id);
 const keys=Object.keys(D.days).sort();while(keys.length>45)delete D.days[keys.shift()];
 save();pubRoom();return rec}
function missionState(){const L=luckState(),d=L.fortune.date;if(!L.mission||L.mission.date!==d)L.mission={date:d,acts:{},claimed:false};return L.mission}
function missionAct(kind){const M=missionState();M.acts[kind]=true;save();tryMission()}
function tryMission(){const L=luckState(),M=missionState();if(M.claimed||!L.fortune.flipped)return 0;const m=LK.missionOf(L.secret,M.date);if(!M.acts[m.id])return 0;
 M.claimed=true;state.coins+=LK.MISSION_COIN;save();setTimeout(()=>toast(`🍀 행운 미션 완료! ${coinLabel(LK.MISSION_COIN)}`),300);return LK.MISSION_COIN}
const TIER_CLS={common:"t-c",rare1:"t-r1",rare2:"t-r2",legend:"t-lg"};
function stoneTag(st){return `<span class="stier ${TIER_CLS[st.tier]}">${LK.STONE_TIERS[st.tier].name}</span>`}
function missionCard(){const L=luckState(),M=missionState(),m=LK.missionOf(L.secret,M.date);

function dexSection(){const D=dexState(),n=LK.STONES.filter(s=>D.have[s.id]).length;

  <button class="btn ghost wide" data-act="myRoom">🏠 내 방 진열장 보기 · 놀러 온 돌도 볼 수 있어요</button></section>`}
function showcase(list,nick){const have=Object.fromEntries((list||[]).map(x=>[x,1])),n=LK.STONES.filter(s=>have[s.id]).length,tt=dexTitles(have);

   의미 유사도: 한국어 단어 임베딩으로 미리 계산한 값(wordgame.js + words/). 명사 3만여 개 중 하나가 정답이에요. */

const GAME_CFG={

const GAME_NAMES=["칼퇴돌","몽돌","차돌","짱돌","공깃돌","디딤돌","주춧돌","맷돌","부싯돌","섬돌","자갈대리","몽글돌"];
function gameState(){const d=today();if(!state.game||state.game.date!==d||state.game.v!==4)state.game={v:4,date:d,guesses:[],solved:false,solvedAt:null,gaveUp:false,hints:[]};if(!state.game.hints)state.game.hints=[];return state.game}
/* 랭킹 미리보기: 서버 연결 전까지는 예시 기록 + 내 기록. 정렬 규칙(힌트 없이 → 시도 수 → 먼저 맞힌 시각)은 실제 랭킹과 같아요. */
function exampleRows(date){const r=rng(hash("rank2"+date));let a=9,min=9*60+12;return GAME_NAMES.map((n,i)=>{if(i>0)a+=2+Math.floor(r()*9);min+=Math.floor(r()*40)+6;return {name:n,attempts:a,hint:r()<.3,at:pad(Math.floor(min/60)%24)+":"+pad(min%60)}})}
function challengers(date){const base=9000+hash("ch"+date)%5000,h=new Date().getHours()+new Date().getMinutes()/60;return Math.round(base*(0.35+0.65*Math.min(1,h/18)))}
function ranking(){const g=gameState();const rows=exampleRows(g.date).map(x=>Object.assign({me:false},x));if(g.solved)rows.push({name:"나 · 돌대리",attempts:g.guesses.length,hint:g.hints.some(h=>h!=="len"),at:g.solvedAt,me:true});rows.sort((a,b)=>(a.hint-b.hint)||a.attempts-b.attempts||a.at.localeCompare(b.at)||(a.me?1:-1));return rows}
/* 돌 위치: 1000위 안에 들면 순위로, 밖이면 유사도로 */
function gpos(x,D){if(!x)return 6;if(x.rank===0)return 100;if(x.rank<=GAME_CFG.rankReveal)return 34+62*(1-Math.log(x.rank)/Math.log(GAME_CFG.rankReveal));return 6+26*Math.min(1,Math.max(0,x.s)/Math.max(1,D?D.thr:30))}
const heat=r=>r===0?"정답":r<=10?"🔥 아주 가까워요":r<=100?"♨️ 뜨거워요":r<=1000?"☀️ 따뜻해요":"❄️ 아직 멀어요";
function bestGuess(g){return g.guesses.reduce((m,x)=>!m||x.s>m.s?x:m,null)}
function gameCard(){
 const g=gameState(), no=TW.dayNo(g.date), best=bestGuess(g), rows=ranking(), top=rows[0], me=rows.findIndex(x=>x.me)+1;
 const x=g.solved?100:gpos(best,TW.day(g.date));
 return `<section class="gcard" aria-labelledby="gc-t"><div class="gc-h"><b id="gc-t">🎮 오늘의 퇴근각</b><span class="new">NEW</span></div>
 <div class="gc-body"><div class="gc-topic"><span>오늘의 주제 · No.${no}</span><b>${TW.day(g.date)?TW.day(g.date).cat:"주제 확인 중"}</b></div>
 <p class="gc-copy">${g.solved?`<b>${g.guesses.length}번 만에 퇴근 성공!</b><br>오늘 칼퇴 랭킹 ${me}위예요`:g.gaveUp?`오늘의 단어는 「${esc(g.answer||"")}」였어요.<br>내일 다시 도전해요`:best?`가장 가까운 단어 「${esc(best.w)}」<br>${best.rank<=GAME_CFG.rankReveal?best.rank+"위":"1000위 밖"} · ${heat(best.rank)}`:`주제 속 명사 하나!<br>뜻이 가까울수록 돌이 굴러가요`}</p></div>
 <div class="gc-track" aria-hidden="true"><i class="gc-peb" style="left:${x}%"></i><span class="gc-exit">EXIT</span></div>
 <p class="hint gc-count">현재 <span class="mono">${won(challengers(g.date))}</span>개의 돌이 도전 중 <span class="pv">미리보기</span></p>
 <button class="btn wide" data-act="game">${g.solved||g.gaveUp?"결과·랭킹 보기":g.guesses.length?`이어서 굴리기 · ${g.guesses.length}회 →`:"돌 굴리기 →"}</button>
 <div class="gc-rank"><span>🏆 오늘의 칼퇴 기록</span><b>1위 ${top.name} · ${top.attempts}회${top.hint?" 💡":""}</b></div></section>`;
}
function guessRows(g){
 const last=g.guesses.length?g.guesses[g.guesses.length-1].w:null;
 return g.guesses.slice().sort((a,b)=>b.s-a.s).map(x=>`<li class="${x.w===last?"last":""} ${x.rank===0?"hit":""}"><span class="gn mono">${x.n}</span><b>${esc(x.w)}</b><span class="gbar"><i style="width:${Math.max(2,x.rank===0?100:x.rank<=GAME_CFG.rankReveal?gpos(x):Math.max(0,x.s))}%"></i></span><span class="gs mono">${x.s.toFixed(2)}</span><span class="gr mono">${x.rank===0?"정답":x.rank<=GAME_CFG.rankReveal?x.rank+"위":"–"}</span></li>`).join("");
}
function rankHTML(){
 const rows=ranking();const me=rows.findIndex(x=>x.me);
 const show=rows.filter((x,i)=>i<5||x.me);
 return `<div class="grank"><div class="grank-h"><b>오늘의 칼퇴 랭킹</b><span class="pv">미리보기 · 예시 기록</span></div>
 <ol>${show.map(x=>{const i=rows.indexOf(x)+1;return `<li class="${x.me?"me":""}"><span class="mono">${i}</span><b>${x.name}</b><span class="mono">${x.attempts}회${x.hint?" 💡":""} · ${x.at}</span></li>`}).join("")}</ol>
 <p class="hint" style="margin:0">힌트(💡) 없이 맞힌 기록이 먼저, 그다음 시도 횟수가 적을수록, 같으면 먼저 맞힌 돌이 위로 가요. ${me<0?"정답을 맞히면 랭킹에 올라가요.":""}</p></div>`;
}
function hintsHTML(g,D){
 const used=g.hints, done=g.solved||g.gaveUp;
 const val=h=>h==="len"?`정답은 <b>${[...D.secret].length}글자</b>예요`:h==="near"?`100위 안 단어: <b>「${esc(D.hintWord)}」</b>`:`첫 글자 초성: <b>${TW.initial(D.secret)}</b>`;
 const next=GAME_CFG.hints.find(h=>!used.includes(h.id));
 return `<div class="ghints">${used.map(h=>`<p class="ghint">💡 ${val(h)}</p>`).join("")}
  ${!done&&next?`<button class="btn ghost ghint-b" data-act="gameHint:${next.id}">💡 힌트 ${used.length+1}/3 · ${next.name} ${next.cost?`(${next.cost}코인)`:"(무료)"}</button>`:""}</div>`;
}
function gameHTML(){
 const g=gameState(), D=TW.day(g.date);
 if(!D)return `<div class="ghead"><div><span class="hint">오늘의 퇴근각</span><h2>단어를 불러오는 중…</h2></div><button class="gx" data-act="close" aria-label="닫기">×</button></div><p class="hint">잠시만요.</p>`;
 const best=bestGuess(g), x=g.solved?100:gpos(best,D), done=g.solved||g.gaveUp;
 return `<div class="ghead"><div><span class="hint">오늘의 퇴근각 · No.${D.no}</span><h2>주제: ${D.cat||"오늘의 명사"}</h2></div><button class="gx" data-act="close" aria-label="닫기">×</button></div>
 <div class="gscene" aria-label="돌이 출구까지 굴러가는 거리"><div class="gdesk"></div><div class="gdesk d2"></div>
  <div class="gdoor"><span class="gsign">비상구 · 퇴근</span></div>
  <img id="gpeb" class="gpeb ${g.solved?"out":""}" src="pose-base.png" alt="" style="left:${x}%;--r:${x*7.2}deg">
  <span class="gdist mono" id="gdist">${g.solved?"퇴근 완료":"출구까지 "+Math.round(100-x)+"%"}</span></div>
 <p class="gmsg" id="gmsg" aria-live="polite">${g.solved?`<b>퇴근 성공!</b> ${g.guesses.length}번 만에 「${esc(D.secret)}」를 맞혔어요.`:g.gaveUp?`오늘의 단어는 <b>「${esc(D.secret)}」</b>였어요.`:g.guesses.length?"뜻이 더 가까운 명사를 찾아보세요. 1000위 안에 들면 순위가 보여요.":"주제와 관련된 명사를 넣어 보세요. 정답과 뜻이 가까울수록 돌이 출구로 굴러가요."}</p>
 ${done?rankHTML():`<form id="gform" class="gform" autocomplete="off"><label for="gin" class="sr">단어 입력</label><input id="gin" name="w" maxlength="12" placeholder="예: 커피" enterkeyhint="send"><button class="btn" type="submit">굴리기</button></form>`}
 ${hintsHTML(g,D)}
 <div class="glist-h"><b>내 시도 <span class="mono" id="gcnt">${g.guesses.length}</span>회</b><span class="hint">유사도 · 순위 (명사 ${won(TW.size)}개 중)</span></div>
 <ol class="glist" id="glist">${guessRows(g)}</ol>
 ${done?"":`<p class="hint gnear">참고: 1위 단어 유사도 ${D.near[0].toFixed(2)} · 10위 ${D.near[1].toFixed(2)} · 100위 ${D.near[2].toFixed(2)} · 1000위 ${D.near[3].toFixed(2)}</p><div id="giveArea"><button class="linkbtn" data-act="giveUp">포기하고 정답 보기</button></div>`}`;
}
async function openGame(){
 const g=gameState();
 if(!TW.day(g.date)){modal(gameHTML());try{await TW.load(g.date)}catch(e){modal(`<div class="ghead"><div><span class="hint">오늘의 퇴근각</span><h2>단어를 불러오지 못했어요</h2></div><button class="gx" data-act="close" aria-label="닫기">×</button></div><p class="hint">${e&&e.message==="nodata"?"오늘의 단어가 아직 준비되지 않았어요. 곧 채워 둘게요.":"인터넷 연결을 확인하고 다시 열어 주세요."}</p>`);return}}
 modal(gameHTML());setTimeout(()=>{const i=document.getElementById("gin");if(i&&matchMedia("(pointer:fine)").matches)i.focus()},50);
}
function useHint(id){
 const g=gameState(),D=TW.day(g.date);if(!D||g.solved||g.gaveUp||g.hints.includes(id))return;
 const h=GAME_CFG.hints.find(x=>x.id===id),next=GAME_CFG.hints.find(x=>!g.hints.includes(x.id));if(!h||h!==next)return;
 if(h.cost&&state.coins<h.cost){toast(`월급코인이 ${won(h.cost-state.coins)} 부족해요`);return}
 if(h.cost){state.coins-=h.cost;const cv=document.getElementById("coinv");if(cv)cv.textContent=won(state.coins)}
 g.hints.push(id);save();modal(gameHTML());
}
function submitGuess(raw){
 const g=gameState(),D=TW.day(g.date);if(g.solved||g.gaveUp||!D)return;
 const r=TW.score(raw,g.date), msg=document.getElementById("gmsg");
 if(!String(raw).trim())return;
 if(!r.known){msg.innerHTML=`「${esc(r.w)}」은(는) 돌대리 사전(명사 ${won(TW.size)}개)에 없는 말이에요. 시도 횟수에 넣지 않았어요.`;return}
 if(g.guesses.some(x=>x.w===r.w)){msg.innerHTML=`「${esc(r.w)}」은(는) 이미 넣었어요.`;return}
 const prevBest=bestGuess(g);
 g.guesses.push({w:r.w,s:r.s,rank:r.rank,n:g.guesses.length+1});
 const best=bestGuess(g),x=gpos(best,D), peb=document.getElementById("gpeb");
 if(peb){peb.style.left=(r.rank===0?100:x)+"%";peb.style.setProperty("--r",(x*7.2)+"deg")}
 if(r.rank===0){
  g.solved=true;g.solvedAt=nowHM();g.answer=D.secret;
  const bonus=g.hints.some(h=>h!=="len")?0:(GAME_CFG.bonus.find(([n])=>g.guesses.length<=n)||[0,0])[1];state.coins+=GAME_CFG.base+bonus;gainXp(30);save();
  setTimeout(()=>{if(peb)peb.classList.add("out")},900);
  setTimeout(()=>{modal(gameHTML());toast(`퇴근 성공! 코인 +${GAME_CFG.base+bonus}`)},1900);
  msg.innerHTML=`<b>정답!</b> 돌대리가 출구로 굴러가요…`;
 }else{
  msg.innerHTML=`「${esc(r.w)}」 유사도 <b class="mono">${r.s.toFixed(2)}</b>${r.rank<=GAME_CFG.rankReveal?` · <b class="mono">${r.rank}위</b>`:" · 1000위 밖"} · ${heat(r.rank)}${prevBest&&r.s>prevBest.s?" · 최고 기록!":""}`;
 }
 const d=document.getElementById("gdist");if(d)d.textContent=r.rank===0?"퇴근 완료":"출구까지 "+Math.round(100-x)+"%";
 document.getElementById("glist").innerHTML=guessRows(g);document.getElementById("gcnt").textContent=g.guesses.length;
 save();
}

/* ---------- v10: 돌퇴근 (횡스크롤 러닝 게임) ----------
   규칙·검증은 runner-core.js, 화면은 runner.js. 여기서는 기록·보상·랭킹만 다뤄요.
   보상: 퇴근 성공한 판의 자갈만 월급코인으로 바꿔줘요(1개=10코인), 하루 최대 RUN_CAP개. 같은 판(runId)은 두 번 지급하지 않아요. */
const RK=window.TG_RUNNER_CORE, RUN_CAP=60, STAGE_COIN=50, FRI_TITLE="불금 탈출러", DREAM_TITLE="꿈 탈출러";
function runState(){
 if(!state.runner)state.runner={unlocked:1,sel:1,best:{},bestScore:{},chainBest:null,week:{key:null,best:{}},titles:[],paid:{date:null,pebbles:0,xp:[]},runs:[],plays:0,mute:false};
 const R=state.runner,wk=weekKey();if(R.week.key!==wk)R.week={key:wk,best:{}};
 const d=LK.kstDate();if(R.paid.date!==d)R.paid={date:d,pebbles:0,xp:[],stages:[]};
 return R;
}
function weekKey(){const d=new Date(LK.kstDate()+"T00:00:00Z"),day=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-day+3);const y=d.getUTCFullYear(),j4=new Date(Date.UTC(y,0,4));
 const w=1+Math.round(((d-j4)/864e5-3+((j4.getUTCDay()+6)%7))/7);return y+"-W"+String(w).padStart(2,"0")}
function isFriday(){return new Date(LK.kstDate()+"T00:00:00Z").getUTCDay()===5||/[?&]friday=1/.test(location.search)}
function daysToFri(){const w=new Date(LK.kstDate()+"T00:00:00Z").getUTCDay();return (5-w+7)%7||7}
let runBoardCache={key:null,rows:null,at:0};
function loadRunBoard(sid){const RS=runState(),key=RS.week.key+"_"+sid;
 if(CM.state.mode!=="shared"||!CM.runBoard)return;
 if(runBoardCache.key===key&&Date.now()-runBoardCache.at<30000)return;
 runBoardCache={key,rows:runBoardCache.key===key?runBoardCache.rows:null,at:Date.now()};
 CM.runBoard(RS.week.key,sid).then(rows=>{runBoardCache.rows=rows;if(state.tab==="today"&&!document.getElementById("modal").innerHTML&&!document.querySelector(".rn"))render()})}
/* v50: 이어 달리기 — 1~4단계가 한 판. 거리 코인은 「그날 최고 기록을 넘은 만큼」만, 순위는 매일 */
const RUN_SEG_M=[200,450,750,1050], RUN_DIST_CAP=400;
function runCoinAt(m){const T=[[0,0],[200,40],[450,100],[750,200],[1050,300]];
 for(let k=1;k<T.length;k++)if(m<=T[k][0]){const [a,ca]=T[k-1],[b,cb]=T[k];return ca+(cb-ca)*(m-a)/(b-a)}
 return Math.min(RUN_DIST_CAP,300+(m-1050)*.303)}
function runDay(){const RS=runState(),d=LK.kstDate();if(!RS.day||RS.day.date!==d)RS.day={date:d,best:0,coins:0,xp:[],plays:0};return RS.day}
function runSeed(){return stHash("tgj-run-"+LK.kstDate())>>>0}
let runDayBoard={key:null,rows:null,at:0};
function loadDayBoard(){const key=LK.kstDate()+"_run";
 if(CM.state.mode!=="shared"||!CM.runBoard)return;
 if(runDayBoard.key===key&&Date.now()-runDayBoard.at<30000)return;
 runDayBoard={key,rows:runDayBoard.key===key?runDayBoard.rows:null,at:Date.now()};
 CM.runBoard(LK.kstDate(),"run").then(rows=>{runDayBoard.rows=rows;if(state.tab==="today"&&!document.getElementById("modal").innerHTML&&!document.querySelector(".rn"))render()})}
function runnerCard(){
 const RS=runState(),D=runDay(),fri=isFriday(),best=D.best,all=RS.allBest||0;
 const segs=[["🚪","사무실",200],["🚇","지옥철",450],["🏠","집까지",750],["⏰","꿈속 야근",1050]];
 const cur=segs.findIndex(x=>best<x[2]);
 const strip=segs.map(([e,n,m],k)=>`<div class="rs-seg ${best>=m?"done":k===cur?"now":""}"><i>${best>=m?"✓":e}</i><b>${n}</b><small>~${won(m)}m</small></div>`).join("")+`<div class="rs-seg inf ${best>=1050?"now":""}"><i>🔥</i><b>야근 N회차</b><small>끝없이</small></div>`;
 loadDayBoard();
 const rows=runDayBoard.key===LK.kstDate()+"_run"?runDayBoard.rows:null;
 let rank;
 if(CM.state.mode==="shared"&&rows&&rows.length){const me=rows.findIndex(x=>x.me);
  rank=`<div class="rs-rank"><span>🏆 오늘의 퇴근길 랭킹</span><ol>${rows.slice(0,3).map((r,k)=>`<li class="${r.me?"me":""}"><em>${k+1}</em>${esc(r.nick)}<b class="mono">${won(r.m)}m</b></li>`).join("")}</ol>${me>2?`<p>나는 <b>${me+1}위</b> · ${won(rows[me].m)}m</p>`:me<0?`<p>한 판 달리면 랭킹에 올라가요</p>`:""}</div>`}
 else if(CM.state.mode==="shared")rank=`<div class="rs-rank"><span>🏆 오늘의 퇴근길 랭킹</span><p>${rows?"아직 아무도 안 달렸어요 · 첫 1등이 되어 보세요":"불러오는 중…"}</p></div>`;
 else rank=`<div class="rs-rank"><span>🏆 오늘의 퇴근길 랭킹</span><p>서버가 연결되면 열려요 · 지금은 내 기록만 보여요</p></div>`;
 const title=RS.titles.includes(DREAM_TITLE)?`<span class="rc-title">🌙 ${DREAM_TITLE}</span>`:RS.titles.includes(FRI_TITLE)?`<span class="rc-title">🔥 ${FRI_TITLE}</span>`:`<span class="new">NEW</span>`;
 const capped=D.coins>=RUN_DIST_CAP;
 return `<section class="gcard rcard" aria-labelledby="rc-t"><div class="gc-h"><b id="rc-t">🏃 돌퇴근 · 이어 달리기</b>${title}</div>
 <div class="rc-hero" aria-hidden="true"><i class="rc-o o1"></i><i class="rc-peb"></i><span class="rc-door">퇴근</span></div>
 <p class="gc-copy" style="margin:0"><b>1~4단계가 한 판으로!</b> 갈수록 빨라지고 ❤️ 3개를 다 쓰면 끝이에요. 오늘 코스는 모두 같아요.</p>
 <div class="rs-strip">${strip}</div>
 <div class="rs-stats"><div><span>오늘 최고</span><b class="mono">${won(best)}m</b></div><div><span>역대 최고</span><b class="mono">${won(all)}m</b></div><div><span>오늘 받은 코인</span><b class="mono">${won(D.coins)}<small>/${RUN_DIST_CAP}</small></b></div></div>
 <button class="btn wide" data-act="run:run">${best?`오늘 최고 ${won(best)}m 넘으러 가기 →`:"달리기 시작 →"}</button>
 <p class="hint" style="margin:0">${capped?"오늘 거리 코인은 다 받았어요. 랭킹 도전은 계속할 수 있어요!":`멀리 갈수록 코인을 받아요 · 같은 날엔 <b>오늘 최고 기록을 넘은 거리만큼만</b> 더 받아요 · 꿈속 야근(1,050m)까지 가면 300코인`}</p>
 ${rank}
 ${fri?`<button class="btn gold wide rc-fri" data-act="run:fri">🔥 불금 탈출 열림${RS.best.fri?" · 최고 "+TG_RUNNER.fmt(RS.best.fri.ms):" · 금요일 한정"}</button>`:`<p class="hint rc-frih">🔥 금요일엔 특별 스테이지 「불금 탈출」이 열려요 · ${daysToFri()}일 남음</p>`}
 </section>`;
}
function runEndRun(res,RS,info){
 const D=runDay();D.plays++;const m=res.meters;
 info.dayBest=D.best;RS.allBest=RS.allBest||0;info.allBest=RS.allBest;
 if(m>RS.allBest){if(RS.allBest)info.newAll=true;RS.allBest=m}
 if(m>D.best){const before=Math.floor(runCoinAt(D.best)),after=Math.floor(runCoinAt(m));info.newDay=D.best>0;info.gain=m-D.best;D.best=m;
  const c=Math.max(0,Math.min(RUN_DIST_CAP-D.coins,after-before));
  if(c>0){D.coins+=c;state.coins+=c;info.coins=c}
  else info.capNote=D.coins>=RUN_DIST_CAP?"오늘 거리 코인은 다 받았어요. 내일 또 받아요!":`조금만 더! 10m쯤 더 가면 코인이 붙어요`;
  if(CM.state.mode==="shared"&&CM.runSubmit){info.rank="오늘의 랭킹에 기록을 올렸어요.";CM.runSubmit({sid:"run",week:D.date,m:D.best,ms:res.ms,score:res.score}).then(()=>{runDayBoard.at=0})}}
 else info.capNote=`오늘 최고 <b>${won(D.best)}m</b>를 넘으면 넘은 거리만큼 코인을 더 받아요`;
 RUN_SEG_M.forEach((sm,k)=>{if(m>=sm&&!D.xp.includes(k)){D.xp.push(k);gainXp(15)}});

function runEnd(res){

 const v=RK.verify(res.sid,res.seed,res.inputs,{state:res.state,ms:res.ms,score:res.score,pebbles:res.pebbles});
 if(!v.ok||res.wallMs<res.ms*.9-80){info.invalid=true;save();return info}

 RS.runs.push(res.runId);if(RS.runs.length>40)RS.runs.shift();

  if(!RS.week.best[key]||res.ms<RS.week.best[key])RS.week.best[key]=res.ms;
  /* v32: 스테이지마다 하루 첫 클리어에만 50코인 */

  if(!RS.paid.stages.includes(key)){RS.paid.stages.push(key);info.coins=STAGE_COIN;info.stagePay=true;state.coins+=STAGE_COIN}
  else info.capNote=`오늘 이 스테이지 보상은 이미 받았어요. 내일 다시 깨면 또 받아요!`;
  if(!RS.paid.xp.includes(key)){RS.paid.xp.push(key);gainXp(15)}
  if(res.sid==="fri"&&!RS.titles.includes(FRI_TITLE)){RS.titles.push(FRI_TITLE);info.title=true}
  if(res.sid==4&&!RS.titles.includes(DREAM_TITLE)){RS.titles.push(DREAM_TITLE);info.title=true}
  if(res.chainTotal!=null&&(!RS.chainBest||res.chainTotal<RS.chainBest)){info.chainBest=true;RS.chainBest=res.chainTotal}

 }
 save();return info;
}

function modal(html){document.getElementById("modal").innerHTML=`<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`}

/* v14: 십자 복도 + 방 안까지 걷기 — 걸을 수 있는 사각형(WALK)을 격자로 바꿔 길을 찾아요 (대각선 포함, 벽 모서리는 못 질러가요) */
const inR=(r,x,y)=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;

function vGrid(){if(VGRID&&VGRID.W===VG.WALK)return VGRID;const cols=Math.ceil(VG.W/GC),rows=Math.ceil(VG.H/GC),g=new Uint8Array(cols*rows);
 for(let j=0;j<rows;j++)for(let i=0;i<cols;i++)if(walkable((i+.5)*GC,(j+.5)*GC))g[j*cols+i]=1;

function lineOK(ax,ay,bx,by){const d=Math.hypot(bx-ax,by-ay),n=Math.ceil(d/1.5);for(let k=1;k<n;k++){const t=k/n;if(!walkable(ax+(bx-ax)*t,ay+(by-ay)*t))return false}return true}

 const G=vGrid(),C=G.cols,cell=(x,y)=>{let i=Math.floor(x/GC),j=Math.floor(y/GC);i=Math.max(0,Math.min(C-1,i));j=Math.max(0,Math.min(G.rows-1,j));return j*C+i};

  if(p.anon&&CM.blocked&&CM.blocked(p.anon)){el.hidden=true;return}el.hidden=false;
  const ek=JSON.stringify(p.eq||{});if(el.dataset.eq!==ek){el.dataset.eq=ek;el.querySelector(".bod").innerHTML=stoneSvg(p.eq||{})}
  const ox=parseFloat(el.dataset.x||p.x);if(Math.abs(p.x-ox)>1)el.classList.toggle("left",p.x<ox);el.dataset.x=p.x;
  el.dataset.anon=p.anon||"";el.dataset.nick=p.nick||"돌";el.querySelector(".bod").setAttribute("aria-label",(p.nick||"돌")+"에게 인사 보내기");
  el.style.left=pct(p.x,VG.W);el.style.top=pct(p.y,VG.H);el.querySelector(".vname").textContent=p.nick||"돌";

   if(p.emo.to&&p.emo.to===CM.state.me.anon)toast(`${p.nick||"이웃 돌"}이(가) ${p.emo.e} ${emoText(p.emo.e)} 인사를 보냈어요`)}});
 [...peers.children].forEach(el=>{if(!have.has(el.dataset.peer))el.remove()})}

   if(VIL.near&&VIL.near.id===p.id){vEnter(p.id);return}vGo(p.door.x,p.door.y)}return}

 });

 if(f.id==="bform"){e.preventDefault();const d=document.getElementById("bdate").value,nt=document.getElementById("bnotime").checked,t=nt?"":document.getElementById("btime").value,err=document.getElementById("berr");

 if(f.id==="nform"){e.preventDefault();const v=cleanName(document.getElementById("nin").value),h=hood();h.dNick=v;const btn=f.querySelector('[type=submit]');btn.disabled=true;
  if(!v){btn.disabled=false;const el=document.getElementById("nerr");if(el)el.textContent="이름을 입력해 주세요.";return}

 if(f.id==="dmfirst"){e.preventDefault();const v=document.getElementById("dmfin").value,err=document.getElementById("dmerr");
  if(CM.contactRisk(v)&&!dmDraft.warned){dmDraft.warned=true;err.textContent="연락처처럼 보이는 내용이 있어요. 익명 커뮤니티에서는 연락처를 주고받지 않는 걸 권해요. 그래도 보내려면 한 번 더 누르세요.";return}
  const btn=f.querySelector('[type=submit]');btn.disabled=true;
  const anon=dmDraft.anon,isNew=!chatPaid(anon),free=isNew&&dmFreeLeft()>0,pay=isNew&&!free&&CHAT_COST>0;

  CM.startDm(anon,v).then(cid=>{if(free)dmUseFree();if(isNew){(state.paidChats||(state.paidChats=[])).push(anon);save()}closeModal();toast(pay?`${won(CHAT_COST)}코인으로 대화를 요청했어요. 이제 이 돌과는 계속 무료예요`:free?`대화를 요청했어요 · 오늘 무료 ${dmFreeLeft()}번 남음`:"대화를 요청했어요. 상대가 수락하면 대화가 열려요");Object.assign(hood(),{v:"chat",cid});render()})
   .catch(x=>{if(pay){state.coins+=CHAT_COST;save()}btn.disabled=false;err.textContent=(x&&x.code==="dm")?x.message:"보내지 못했어요. 잠시 뒤 다시 해 주세요."});return}

 if(f.id==="stRform"){e.preventDefault();const fd=new FormData(f);closeModal();const t=fd.get("target")||null;
